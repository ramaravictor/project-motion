<script>
(async () => {
'use strict';
await Promise.all([
  document.fonts.load("800 100px 'Barlow Condensed'"), document.fonts.load("italic 800 100px 'Barlow Condensed'"),
  document.fonts.load("700 100px 'Barlow Condensed'"), document.fonts.load("700 40px 'JetBrains Mono'"), document.fonts.load("800 40px 'JetBrains Mono'"),
]).catch(() => {});
const Q = new URLSearchParams(location.search);
const RENDER = Q.get('render') === '1', DEBUG = Q.get('debug') === '1';
const W = 1080, H = 1920, FPS = 30;

/* ============ SCENES (estimasi; ganti dengan titik tengah jeda VO) ============ */
const BOUND = [0, 3.26, 5.52, 9.64, 13.44, 17.17, 19.69, 25.41, 30.25, 35.02, 38.47, 45.11, 50.83, 56.60];
const NAMES = ['surat-sampai', 'pssi-turun-tangan', 'michael-diberhentikan', 'vivin-pengganti', 'status-plt', 'michael-menolak', 'statuta-sah', 'siap-ketemu', 'vivin-audit', 'dua-klaim', 'taruhan-2028', 'jangan-rungkad', 'siapa-benar'];
const SCENES = NAMES.map((id, i) => ({ idx: i + 1, id, t0: BOUND[i], t1: BOUND[i + 1] }));
const T = i => SCENES[i - 1].t0;
const DURATION = BOUND[BOUND.length - 1];

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x, o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, i2: x => x * x, i3: x => x * x * x,
  io2: x => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2, io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  back: x => { const c = 1.9, c3 = c + 1; return 1 + c3 * (x - 1) ** 3 + c * (x - 1) ** 2; }
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const pos0 = v => Math.max(.001, v);

/* ============ kamera ============ */
const K = [
  { t: 0, p: [-1.5, 5.5, 6.5], l: [0, 1.2, 0] },
  { t: T(1) + 2.4, p: [.3, 3.6, 4.2], l: [0, 1.0, 0], e: 'io2' },
  { t: T(2) + .3, p: [1.6, 2.4, 3.2], l: [1.0, 1.2, 0], e: 'io3' },
  { t: T(2) + 1.7, p: [1.8, 2.3, 3.0], l: [1.2, 1.2, 0], e: 'lin' },
  { t: T(3) + .6, p: [6, 2.4, 4.2], l: [6, 2.0, 0], e: 'io3' },
  { t: T(5) + .2, p: [6.2, 2.25, 3.4], l: [6.2, 2.1, 0], e: 'io2' },
  { t: T(5) + 2.6, p: [6.4, 2.2, 2.6], l: [6.4, 2.15, 0], e: 'io2' },
  { t: T(6) + .3, p: [5.8, 2.35, 3.8], l: [6, 2.1, 0], e: 'io3' },
  { t: T(7) + .6, p: [14, 1.8, 4.6], l: [14, 1.5, 0], e: 'io3' },
  { t: T(7) + 4.6, p: [14, 1.7, 4.0], l: [14, 1.5, 0], e: 'lin' },
  { t: T(8) + .5, p: [14, 1.6, 5.0], l: [14, .8, .6], e: 'io2' },
  { t: T(8) + 3.9, p: [14, 1.5, 4.6], l: [14, .8, .6], e: 'lin' },
  { t: T(9) + .4, p: [16.8, 1.8, 3.6], l: [16.8, 1.6, 0], e: 'io3' },
  { t: T(9) + 4.0, p: [16.8, 1.7, 3.1], l: [16.8, 1.6, 0], e: 'lin' },
  { t: T(10) + .5, p: [6, 2.9, 8.6], l: [6, 2.0, 0], e: 'io3' },
  { t: T(10) + 3.0, p: [6, 2.8, 8.0], l: [6, 2.0, 0], e: 'lin' },
  { t: T(11) + .9, p: [36, 4.6, 7.6], l: [40, .5, 0], e: 'io3' },
  { t: T(11) + 5.6, p: [40.5, 3.3, 5.8], l: [43.5, .6, 0], e: 'io2' },
  { t: T(12) + .4, p: [32.6, 1.0, 2.6], l: [36.6, .4, 0], e: 'io2' },
  { t: T(12) + 3.4, p: [43.0, 1.7, 5.0], l: [46.9, .8, 0], e: 'io2' },
  { t: T(13) + .7, p: [45.2, 4.6, 10.0], l: [47.0, 1.3, 0], e: 'io3' },
  { t: DURATION, p: [45.4, 4.3, 9.4], l: [47.0, 1.4, 0], e: 'lin' },
];
function camAt(t) {
  let i = K.findIndex(k => k.t > t);
  if (i === -1) i = K.length - 1;
  if (i === 0) i = 1;
  const a = K[i - 1], b = K[i], k = E[b.e || 'io2'](pr(t, a.t, b.t));
  return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l.map((v, j) => lerp(v, b.l[j], k)) };
}
const SHAKES = [];
const shakeAt = t => SHAKES.reduce((a, [s, amp]) => t >= s ? a + amp * Math.exp(-(t - s) * 9) : a, 0);

/* ============ HUD ============ */
const SAYS = [
  { s: 1, pos: 'top', at: .3, size: 104, txt: 'Surat-surat itu sampai ke [PSSI]' },
  { s: 2, pos: 'bot', at: .2, size: 130, txt: 'PSSI turun [tangan]' },
  { s: 3, pos: 'bot', at: 1.2, size: 112, txt: 'Michael [diberhentikan]' },
  { s: 4, pos: 'bot', at: .9, size: 112, txt: 'Penggantinya dari [PSSI]' },
  { s: 5, pos: 'top', at: .3, size: 130, txt: 'Statusnya [Plt]' },
  { s: 6, pos: 'bot', at: .2, size: 120, txt: 'Tapi Michael [menolak]' },
  { s: 7, pos: 'top', at: .6, out: 3.7, size: 104, txt: 'Menurutnya, [statuta] dilanggar' },
  { s: 7, pos: 'top', at: 3.9, size: 104, txt: 'Dia masih Ketum yang [sah]' },
  { s: 8, pos: 'bot', at: .4, size: 104, txt: 'Siap ketemu pimpinan [PSSI]' },
  { s: 9, pos: 'top', at: .3, size: 100, txt: 'Vivin: ajukan keberatan [resmi]' },
  { s: 10, pos: 'mid', at: .2, size: 124, txt: 'Satu federasi, dua [klaim]' },
  { s: 11, pos: 'top', at: .5, out: 2.8, size: 100, txt: 'Yang dipertaruhkan bukan cuma [jabatan]' },
  { s: 11, pos: 'top', at: 3.0, size: 100, txt: 'Tapi jalan ke Piala Dunia [2028]' },
  { s: 12, pos: 'bot', at: .6, out: 2.55, size: 108, txt: 'Pemain udah kerja keras' },
  { s: 12, pos: 'bot', at: 2.75, size: 120, txt: 'Jangan sampai [rungkad]' },
  { s: 13, pos: 'top', at: .2, size: 104, txt: 'Menurut kamu, siapa yang [benar]?' },
];
const LABELS = [
  { s: 5, at: 1.4, out: 2.9, y: 330, txt: 'PLT · PELAKSANA TUGAS' },
  { s: 9, at: 2.4, out: 3.9, y: 330, txt: 'JANJI: AUDIT TATA KELOLA' },
];
const PH_M = { src: 'assets/face-michael.jpg', cr: 'Foto: Ramadhikaas · CC BY-SA 4.0' };
const PH_E = { src: 'assets/face-erick.jpg', cr: 'Foto: Pemerintah RI · domain publik' };
const LTS = [
  { s: 2, at: .15, out: 1.95, nm: 'Erick Thohir', rl: 'KETUM PSSI', top: true, ph: PH_E },
  { s: 3, at: .3, out: 3.3, nm: 'Michael Sianipar', rl: 'KETUM FFI', top: true, ph: PH_M },
  { s: 4, at: .5, out: 2.8, nm: 'Vivin Cahyani', rl: 'ANGGOTA EXCO PSSI', top: true },
  { s: 6, at: .2, out: 2.1, nm: 'Michael Sianipar', rl: 'MENOLAK DIBERHENTIKAN', top: true, ph: PH_M },
  { s: 8, at: .3, out: 3.9, nm: 'Erick Thohir', rl: 'KETUM PSSI', top: true, ph: PH_E },
];
const tl = gsap.timeline({ paused: true });
const saysEl = document.getElementById('says');
SAYS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'say ' + d.pos; el.style.fontSize = d.size + 'px';
  el.innerHTML = d.txt.split(' ').map(w => {
    if (!/^\[.*\]/.test(w)) return `<span class="w"><span class="wi">${w}</span></span>`;
    const core = w.replace(/^\[(.*?)\].*$/, '$1'), tail = w.replace(/^\[(.*?)\]/, '');
    return `<span class="w hl"><i class="bar"></i><span class="wi">${core}</span>${tail}</span>`;
  }).join('');
  saysEl.appendChild(el);
  const at = T(d.s) + d.at, out = T(d.s) + (d.out ?? (SCENES[d.s - 1].t1 - T(d.s) - .32));
  const ws = el.querySelectorAll('.w');
  tl.fromTo(ws, { yPercent: 70, opacity: 0, filter: 'blur(14px)' }, { yPercent: 0, opacity: 1, filter: 'blur(0px)', duration: .55, ease: 'power4.out', stagger: .075 }, at);
  const bars = el.querySelectorAll('.bar');
  if (bars.length) tl.fromTo(bars, { scaleX: 0 }, { scaleX: 1, duration: .35, ease: 'power3.out', stagger: .1 }, at + ws.length * .075 + .15);
  if (d.s !== 13) tl.to(ws, { yPercent: -45, opacity: 0, filter: 'blur(10px)', duration: .32, ease: 'power2.in', stagger: .025 }, out);
});
LABELS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'lbl'; el.textContent = d.txt; el.style.top = d.y + 'px';
  saysEl.appendChild(el);
  tl.fromTo(el, { opacity: 0, clipPath: 'inset(0 100% 0 0)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: .45, ease: 'power3.out' }, T(d.s) + d.at);
  tl.to(el, { opacity: 0, duration: .25, ease: 'power2.in' }, T(d.s) + d.out - .25);
});
LTS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'lt'; if (d.top) { el.style.bottom = 'auto'; el.style.top = '96px'; }
  el.innerHTML = (d.ph ? `<img class="ph" src="${d.ph.src}" alt="">` : '') + `<div class="col"><span class="nm">${d.nm}</span><span class="rl">${d.rl}</span>${d.ph ? `<span class="cr">${d.ph.cr}</span>` : ''}</div>`;
  saysEl.appendChild(el);
  tl.fromTo(el, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: .5, ease: 'power3.out' }, T(d.s) + d.at);
  tl.to(el, { opacity: 0, x: -50, duration: .3, ease: 'power2.in' }, T(d.s) + d.out - .3);
});
const chips = document.querySelectorAll('#poll .ch, #poll .cta');
tl.fromTo(chips, { opacity: 0, x: -70, scale: .9 }, { opacity: 1, x: 0, scale: 1, duration: .5, ease: 'back.out(1.7)', stagger: .28 }, T(13) + 1.4);
tl.set({}, {}, DURATION);

/* ============ Three.js ============ */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070F26, 22, 60);
const cam = new THREE.PerspectiveCamera(50, W / H, .05, 200);
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x0d1f4a, .85); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, .9); dir.position.set(-4, 12, 7); scene.add(dir);
const redL = new THREE.PointLight(0xff2030, 0, 9); scene.add(redL);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 8; return { c, g, tx };
}
function sprite(text, { size = 120, weight = 800, fam = 'Barlow Condensed', color = '#fff', bg = null, pad = 26, h = .6, border = null } = {}) {
  const m = document.createElement('canvas').getContext('2d'); m.font = `${weight} ${size}px '${fam}'`;
  const tw = Math.ceil(m.measureText(text).width) + pad * 2 + (border ? 12 : 0), th = Math.ceil(size * 1.25) + pad;
  const { tx } = canvasTex(tw, th, (g, w, hh) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, hh); }
    if (border) { g.fillStyle = border; g.fillRect(0, 0, 12, hh); }
    g.font = `${weight} ${size}px '${fam}'`; g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, pad + (border ? 12 : 0), hh / 2 + size * .04);
  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, transparent: true, depthWrite: false }));
  sp.scale.set(h * tw / th, h, 1); return sp;
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .6, ...o });
const gold = std(0xE7B530, { metalness: .55, roughness: .3, emissive: 0x4a3000 });
const reveal = (geo, f, segs, rad) => geo.setDrawRange(0, Math.floor(cl(f) * segs) * rad * 6);

/* lantai, lampu, debu naik */
const floorT = canvasTex(512, 512, (g, w, h) => { for (let y = 0; y < h; y += 32) { g.fillStyle = ['#8A5A34', '#93623A', '#7F5230', '#9A6840'][(y / 32) % 4]; g.fillRect(0, y, w, 32); g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, y, w, 2); for (let x = ((y / 32) % 2) * 128; x < w; x += 256) g.fillRect(x, y, 2, 32); } });
floorT.tx.wrapS = floorT.tx.wrapT = THREE.RepeatWrapping; floorT.tx.repeat.set(60, 20);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 80), new THREE.MeshStandardMaterial({ map: floorT.tx, roughness: .9 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(30, -.01, 0); scene.add(floor);
[0, 6, 14, 17, 40, 46].forEach(x => {
  const fx = new THREE.Mesh(new THREE.BoxGeometry(1.2, .22, .5), new THREE.MeshBasicMaterial({ color: 0xffffff })); fx.position.set(x, 8.6, -.4); scene.add(fx);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(2.0, 8.4, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0xBFD8FF, transparent: true, opacity: .05, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  cone.position.set(x, 4.4, -.4); scene.add(cone);
});
const DUST = 420, dustG = new THREE.BufferGeometry(), dustP = new Float32Array(DUST * 3);
dustG.setAttribute('position', new THREE.BufferAttribute(dustP, 3));
scene.add(new THREE.Points(dustG, new THREE.PointsMaterial({ color: 0x9CC2FF, size: .05, transparent: true, opacity: .55, depthWrite: false })));

/* ---- GOR: tribun penonton, papan LED, rangka atap ---- */
{
  const standM = std(0x1A2547, { roughness: .85 });
  const seats = [];
  for (let r = 0; r < 8; r++) {

    dustP[i * 3] = -6 + hash(i + 1) * 60 + Math.sin(t * .5 + i) * .2; dustP[i * 3 + 1] = (hash(i + 4) * 9 + t * sp) % 9; dustP[i * 3 + 2] = -8 + hash(i + 2) * 14;
  }
  dustG.attributes.position.needsUpdate = true;

  /* Zona A */
  const zA = t < T(3) + 1.0; deskZ.visible = zA;
  ENVS.forEach(e => {
    const f = pr(t, e.ts, e.ts + .7); e.m.visible = zA && f > 0;
    if (!e.m.visible) return;
    const st = V(e.x0, 7, -2 + e.x0 * .2), mid = st.clone().lerp(e.end, .5).add(V(0, 1.2, 0));
    e.m.position.copy(bez(st, mid, e.end, E.io2(f)));
    e.m.rotation.set(lerp(-.3, -Math.PI / 2, E.o2(f)), 0, e.yaw + (1 - f) * 4);
  });
  gav.visible = zA && t > T(1) + 1.6;
  let ang = .95;
  if (t > T(1) + 1.6) ang = lerp(1.6, .95, E.o3(pr(t, T(1) + 1.6, T(1) + 2.3)));
  if (t > STRIKE - .3) ang = lerp(.95, 0, E.i3(pr(t, STRIKE - .3, STRIKE)));
  if (t > STRIKE) ang = lerp(0, .5, E.o3(pr(t, STRIKE + .05, STRIKE + .6))) * (1 - .0) ;
  gavIn.rotation.z = ang;

  /* Zona B */
  const zB = (t > T(3) - .5 && t < T(7) + .8) || (t > T(10) - .5 && t < T(11) + 1.2);
  chairMain.visible = zB;
  const ps = plaqueState(t);
  plM.visible = zB && ps.m.vis; plM.position.set(ps.m.x, ps.m.y, PH.z + .02); plM.rotation.set(0, 0, ps.m.r);
  plV.visible = zB && ps.v.vis; plV.position.set(ps.v.x, ps.v.y, PH.z); plV.rotation.set(0, 0, ps.v.r);
  const sk = pr(t, PLT_T, PLT_T + .16); pltS.visible = t >= PLT_T; pltS.scale.setScalar(lerp(2.6, 1, E.i2(sk)));
  const gk = E.o2(pr(t, T(10) + .5, T(10) + 1.2)); ghostM.opacity = .28 * gk;
  ghosts.forEach(g => { g.visible = zB && gk > 0 && t > T(10); });
  const rk = pr(t, T(10) + .35, T(10) + .8);
  rope.visible = zB && t > T(10) + .35 && t < T(11) + 1.2;
  if (rope.visible) { const a = ps.m.x + .75, b = ps.v.x - .75, L = Math.max(.01, (b - a) * rk + .01); rope.scale.y = L; rope.position.set(a + L / 2, PH.y, PH.z + .05); }
  redL.position.set(CH_X, 2.6, 1.6);
  redL.intensity = (t > CRASH && t < T(7) + .3 ? 1.6 * Math.exp(-(t - CRASH) * 1.2) + .5 : 0) + (t > T(10) && t < T(11) + .6 ? 1.4 : 0);

  /* Zona C */
  docG.visible = t > T(7) - .3 && t < T(9) + .9;
  docG.rotation.y = lerp(-1.2, 0, E.back(pr(t, T(7) - .1, T(7) + .6))) + Math.sin(t * .9) * .03;
  reveal(ringGeo, E.io2(pr(t, T(7) + .9, T(7) + 1.6)), 96, 6); ring.visible = t > T(7) + .9;
  ask.visible = t > T(7) + 3.9; ask.scale.setScalar(pos0(E.back(pr(t, T(7) + 3.9, T(7) + 4.3))));
  const nk = E.back(pr(t, T(8) + .4, T(8) + .8)), nk2 = E.back(pr(t, T(8) + 2.6, T(8) + 3.0));
  nodeM.visible = t > T(8) + .4 && t < T(9) + .6; nodeP.visible = t > T(8) + 2.6 && t < T(9) + .6;
  nodeM.material.opacity = cl(nk); nodeP.material.opacity = cl(nk2);
  const bf = E.io2(pr(t, T(8) + 1.2, T(8) + 2.6)); reveal(bridgeGeo, bf, 60, 8); bridge.visible = nodeM.visible && bf > 0;
  pulse.visible = t > T(8) + 2.8 && t < T(9) + .4;
  if (pulse.visible) pulse.position.copy(bridgeC.getPoint(((t - T(8) - 2.8) * .7) % 1));
  clip.visible = t > T(8) + 3.2 && t < T(10) + .4;
  clip.rotation.y = lerp(1.3, -.08, E.back(pr(t, T(9) - .2, T(9) + .5))) + Math.sin(t * .8) * .03;
  drawClip(t > T(9) + 2.3 ? 2 : t > T(9) + .9 ? 1 : 0);

  /* Zona D */
  const zD = t > T(10) + 2;
  [court, goal, tro, arrow, ball, ballSh].forEach(o => o.visible = zD);
  const af = E.io2(pr(t, T(11) + .6, T(11) + 2.0)); reveal(arrowGeo, af, 100, 8);
  arrow.visible = zD && af > 0;
  arrowHead.visible = arrow.visible && af > .02; const ap = arrowC.getPoint(cl(af, .001, 1)), at2 = arrowC.getTangent(cl(af, .001, .999));
  arrowHead.position.copy(ap); arrowHead.quaternion.setFromUnitVectors(V(0, 1, 0), at2);
  const ck = pr(t, CRACK_T, CRACK_T + .45); reveal(crackGeo, ck, 80, 6); crackGlow.geometry.setDrawRange(0, Math.floor(ck * 80) * 36);
  crack.visible = zD && ck > 0; crackGlow.visible = crack.visible;
  crackGlow.material.opacity = .45 * (1 - pr(t, T(12) + 3.4, T(12) + 4.6));
  arrowM.color.setHex(0xFF5A4A).lerp(cC.setHex(0x55607a), pr(t, CRACK_T + .2, CRACK_T + .9) * (1 - pr(t, GOAL_T, GOAL_T + .6)));
  const bx = ballXAt(t), r = .32;
  const hop = bx > 40.6 && bx < 41.6 ? Math.sin(Math.PI * (bx - 40.6) / 1.0) * .45 : 0;
  ball.position.set(bx, r + hop, 0); ball.rotation.set(0, 0, -(bx - 34) / r);
  ballSh.position.set(bx, .012, 0); ballSh.material.opacity = .32 / (1 + hop * 2);
  const gp = t > GOAL_T ? Math.exp(-(t - GOAL_T) * 5) : 0;
  netM.opacity = .35 + gp * .5; netM.color.setRGB(1, 1 - gp * .6, 1 - gp * .7);
  troGlow.intensity = t > GOAL_T ? 2.5 * E.o2(pr(t, GOAL_T, GOAL_T + .8)) : 0;
  tro.rotation.y = (t - T(11)) * .35;

  let fl = 0;
  [[STRIKE, .3], [PLT_T + .15, .18], [CRASH, .22], [CRACK_T + .2, .2], [GOAL_T, .3]].forEach(([s, a]) => { if (t >= s) fl = Math.max(fl, a * Math.exp(-(t - s) * 7)); });
  flashEl.style.opacity = fl.toFixed(3);
  const [a, b] = tintAt(t); stage.style.setProperty('--tA', a); stage.style.setProperty('--tB', b);
  grain.style.transform = `translate(${Math.round(Math.sin(t * 37) * 30)}px, ${Math.round(Math.cos(t * 29) * 30)}px)`;
}

/* ============ seek ============ */
const lookV = V(0, 0, 0);
function applyCam(t) {
  const c = camAt(t), c2 = camAt(Math.max(0, t - 1 / FPS));
  const br = [Math.sin(t * .7) * .06, Math.sin(t * .9) * .05, Math.cos(t * .6) * .05];
  const sh = shakeAt(t), sv = [Math.sin(t * 53) * sh, Math.sin(t * 61 + 1) * sh, Math.sin(t * 47 + 2) * sh];
  cam.position.set(c.p[0] + br[0] + sv[0], c.p[1] + br[1] + sv[1], c.p[2] + br[2]);
  lookV.set(c.l[0] + sv[2], c.l[1], c.l[2]); cam.lookAt(lookV);
  const sp = Math.hypot(c.p[0] - c2.p[0], c.p[1] - c2.p[1], c.p[2] - c2.p[2]) + .5 * Math.hypot(c.l[0] - c2.l[0], c.l[1] - c2.l[1], c.l[2] - c2.l[2]);
  const blur = cl((sp - .3) * 7, 0, 9);
  glEl.style.filter = blur > .2 ? `blur(${blur.toFixed(1)}px)` : 'none';
}
let curT = 0;
function seekTimeline(t) {
  curT = cl(t, 0, DURATION);
  tl.seek(curT, false); update(curT); applyCam(curT); renderer.render(scene, cam);
  if (DEBUG) { dr.value = curT; dt.textContent = curT.toFixed(2) + ' / ' + DURATION.toFixed(2) + ' · ' + (SCENES.find(s => curT >= s.t0 && curT < s.t1) || SCENES.at(-1)).id; }
}
window.seekTo = sec => seekTimeline(sec);

/* ============ SFX ============ */
const SFX = [
  { t: .15, file: 'sfx_whoosh.wav', vol: .15 }, ...[0, 6, 12, 18, 24].map(k => ({ t: T(1) + .2 + k * .075 + .7, file: 'sfx_click.wav', vol: .14 })),
  { t: STRIKE, file: 'sfx_pop.wav', vol: .16 }, { t: T(3) + .1, file: 'sfx_whoosh.wav', vol: .15 },
  { t: T(3) + 1.5, file: 'sfx_whoosh.wav', vol: .14 }, { t: T(4) + .45, file: 'sfx_whoosh.wav', vol: .14 },
  { t: PLT_T + .15, file: 'sfx_pop.wav', vol: .15 }, { t: CRASH, file: 'sfx_glitch.wav', vol: .15 },
  { t: T(7) + .05, file: 'sfx_whoosh.wav', vol: .15 }, { t: T(7) + 3.9, file: 'sfx_pop.wav', vol: .14 },
  { t: T(8) + 1.3, file: 'sfx_click.wav', vol: .14 }, { t: T(9) + .1, file: 'sfx_whoosh.wav', vol: .14 },
  { t: T(9) + .9, file: 'sfx_click.wav', vol: .14 }, { t: T(9) + 2.3, file: 'sfx_click.wav', vol: .14 },
  { t: T(10) + .1, file: 'sfx_whoosh.wav', vol: .15 }, { t: T(11) + .3, file: 'sfx_whoosh.wav', vol: .15 },
  { t: CRACK_T + .2, file: 'sfx_glitch.wav', vol: .15 }, { t: T(12) + .4, file: 'sfx_whoosh.wav', vol: .14 },
  { t: GOAL_T, file: 'sfx_success.wav', vol: .16 }, { t: T(13) + 1.4, file: 'sfx_pop.wav', vol: .14 },
];

/* ============ tampilan & preview ============ */
function fit() { const s = RENDER ? 1 : Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${s})`; stage.style.left = RENDER ? '0' : ((innerWidth - W * s) / 2) + 'px'; }
addEventListener('resize', fit); fit();
const dr = document.getElementById('dbg-r'), dt = document.getElementById('dbg-t');
let playing = !RENDER && Q.get('t') === null, wall = 0, from = 0;
if (DEBUG) { document.body.classList.add('debug'); dr.max = DURATION; dr.oninput = e => { playing = false; seekTimeline(+e.target.value); }; }
const vo = new Audio('vo.mp3'); vo.preload = 'auto';
const bgm = new Audio('assets/bgm.wav'); bgm.preload = 'auto';
function loop(now) {
  if (!playing) return;
  let t = from + (now - wall) / 1000;
  if (t >= DURATION + .8) { from = 0; wall = now; t = 0; try { vo.currentTime = 0; bgm.currentTime = 0; } catch (e) {} }
  seekTimeline(Math.min(t, DURATION)); requestAnimationFrame(loop);
}
function play() { playing = true; wall = performance.now(); from = curT >= DURATION ? 0 : curT; try { vo.currentTime = from; vo.play().catch(() => {}); bgm.currentTime = from; bgm.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }
function pause() { playing = false; try { vo.pause(); bgm.pause(); } catch (e) {} }
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'r' || e.key === 'R') { seekTimeline(0); pause(); play(); }
});
document.getElementById('dbg-play').onclick = () => playing ? pause() : play();

window.OPENER = { ready: false, DURATION, FPS, WIDTH: W, HEIGHT: H, SCENES, SFX, seek: s => window.seekTo(s) };
seekTimeline(Number(Q.get('t')) || 0);
window.OPENER.ready = true;
if (playing) play();
})();
</script>
