(async () => {
'use strict';
await Promise.all([

const Q = new URLSearchParams(location.search);

const W = 1080, H = 1920, FPS = 30;

/* ============ SCENES (dari jeda VO + timestamp Whisper) ============ */
const B = [0, 4.95, 10.76, 14.48, 21.52, 25.40, 30.46, 35.2];
const NAMES = ['nantang-balik', '40-voters-klb', 'pssi-audit-non-apbn', 'michael-apbn-20m', 'ikan-kecil', 'timnas-btn', 'audit-siapa'];
const SCENES = NAMES.map((id, i) => ({ idx: i + 1, id, t0: B[i], t1: B[i + 1] }));
const DURATION = B[7];

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x, o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, i2: x => x * x, i3: x => x * x * x,
  io2: x => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2, io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  back: x => { const c = 1.9, c3 = c + 1; return 1 + c3 * (x - 1) ** 3 + c * (x - 1) ** 2; }
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const pos0 = v => Math.max(.001, v);
function keyAt(K, t) {
  let i = K.findIndex(k => k.t > t);
  if (i === -1) return { ...K.at(-1), s: K.at(-1).s ?? 1 };
  if (i === 0) return { ...K[0], s: K[0].s ?? 1 };
  const a = K[i - 1], b = K[i], k = E[b.e || 'io2'](pr(t, a.t, b.t));
  return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l ? a.l.map((v, j) => lerp(v, b.l[j], k)) : null, s: lerp(a.s ?? 1, b.s ?? 1, k) };
}

const K = [
  { t: 0, p: [0, 2.5, 6.6], l: [0, 1.25, 0] },

  { t: 14.85, p: [24, 2.1, 5.6], l: [24, 1.35, 0], e: 'io3' },

  { t: 21.9, p: [32, 1.8, 5.8], l: [32, 1.3, 0], e: 'io3' },
  { t: 25.1, p: [32.1, 1.7, 5.0], l: [32.1, 1.3, 0], e: 'lin' },
  { t: 25.8, p: [40, 3.4, 7.2], l: [40, .9, 0], e: 'io3' },
  { t: 30.1, p: [40.7, 3.0, 6.4], l: [40.7, 1.0, 0], e: 'lin' },
  { t: 30.8, p: [48, 2.4, 6.4], l: [48, 1.25, 0], e: 'io3' },
  { t: DURATION, p: [48, 2.3, 5.9], l: [48, 1.25, 0], e: 'lin' },

/* ============ kaca pembesar (benang merah) ============ */
const MAGK = [

[31.95, 32.65, 33.6, 34.3].forEach((at, i) => tl.fromTo(chips[i], { opacity: 0, x: -70, scale: .9 }, { opacity: 1, x: 0, scale: 1, duration: .45, ease: 'back.out(1.7)' }, at));

/* ============ Three.js ============ */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
const scene = new THREE.Scene();

const cam = new THREE.PerspectiveCamera(50, W / H, .05, 200);
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x0d1f4a, .85));
const dir = new THREE.DirectionalLight(0xffffff, .9); dir.position.set(-4, 12, 7); scene.add(dir);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 8; return { c, g, tx };
}
function sprite(text, { size = 120, weight = 800, fam = 'Barlow Condensed', color = '#fff', bg = null, pad = 26, h = .6, border = null } = {}) {
  const m = document.createElement('canvas').getContext('2d'); m.font = `${weight} ${size}px '${fam}'`;
  const tw = Math.ceil(m.measureText(text).width) + pad * 2 + (border ? 12 : 0), th = Math.ceil(size * 1.25) + pad;
  const { tx } = canvasTex(tw, th, (g, w, hh) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, hh); }
    if (border) { g.fillStyle = border; g.fillRect(0, 0, 12, hh); }
    g.font = `${weight} ${size}px '${fam}'`; g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, pad + (border ? 12 : 0), hh / 2 + size * .04);
  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, transparent: true, depthWrite: false }));
  sp.scale.set(h * tw / th, h, 1); sp.userData.base = sp.scale.clone(); return sp;
}
const pop = (o, k) => { o.visible = k > 0; o.scale.copy(o.userData.base).multiplyScalar(pos0(k)); };
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .6, ...o });
const gold = std(0xE7B530, { metalness: .55, roughness: .3, emissive: 0x4a3000 });
const face = (geo, tx, side = 0x9aa6c0) => new THREE.Mesh(geo, [0, 0, 0, 0, 1, 0].map(k => k ? new THREE.MeshStandardMaterial({ map: tx, roughness: .8 }) : std(side)));
function stamp(txt, color, w = 1.1) {
  const t = canvasTex(620, 200, (g, cw, ch) => { g.strokeStyle = color; g.lineWidth = 14; g.strokeRect(10, 10, cw - 20, ch - 20); g.fillStyle = color; g.textAlign = 'center'; g.font = "800 128px 'Barlow Condensed'"; g.fillText(txt, cw / 2, 146); });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, w * 200 / 620), new THREE.MeshBasicMaterial({ map: t.tx, transparent: true, depthWrite: false }));
}
const slam = (m, t, at, rz = .18) => { m.visible = t >= at; m.scale.setScalar(lerp(2.6, 1, E.i2(pr(t, at, at + .16)))); m.rotation.z = rz; };

/* lantai, lampu, debu */
const floorT = canvasTex(512, 512, (g, w, h) => { for (let y = 0; y < h; y += 32) { g.fillStyle = ['#8A5A34', '#93623A', '#7F5230', '#9A6840'][(y / 32) % 4]; g.fillRect(0, y, w, 32); g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(0, y, w, 2); for (let x = ((y / 32) % 2) * 128; x < w; x += 256) g.fillRect(x, y, 2, 32); } });
floorT.tx.wrapS = floorT.tx.wrapT = THREE.RepeatWrapping; floorT.tx.repeat.set(60, 20);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 80), new THREE.MeshStandardMaterial({ map: floorT.tx, roughness: .9 }));

[0, 8, 16, 24, 32, 40, 48].forEach(x => {
  const fx = new THREE.Mesh(new THREE.BoxGeometry(1.2, .22, .5), new THREE.MeshBasicMaterial({ color: 0xffffff })); fx.position.set(x, 8.6, -.4); scene.add(fx);

});
const DUST = 420, dustG = new THREE.BufferGeometry(), dustP = new Float32Array(DUST * 3);
dustG.setAttribute('position', new THREE.BufferAttribute(dustP, 3));
const dustM = new THREE.PointsMaterial({ color: 0x9CC2FF, size: .05, transparent: true, opacity: .55, depthWrite: false });
scene.add(new THREE.Points(dustG, dustM));

/* GOR: tribun, LED, rangka atap */
{

  const seats = [];
  for (let r = 0; r < 8; r++) {

    const b = new THREE.Mesh(new THREE.BoxGeometry(84, hgt, .9), standM); b.position.set(24, hgt / 2, z); scene.add(b);
    for (let x = -17.8; x < 65.8; x += .32) seats.push([x, hgt + .13, z + .1]);
  }
  const crowd = new THREE.InstancedMesh(new THREE.BoxGeometry(.18, .26, .18), std(0xffffff, { roughness: .7 }), seats.length);
  const d = new THREE.Object3D(), col = new THREE.Color();
  const PAL = [0xE2272F, 0xF2F2F2, 0x5E7FCC, 0xE2272F, 0x1A2547];
