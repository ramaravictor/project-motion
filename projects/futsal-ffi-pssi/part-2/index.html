<style>
/* Part 2 · "Awal mula: Sekjen dipecat, semua kebongkar"
   Gaya: Opsi B (arena 3D siaran TV), lanjutan Part 1. Tanpa template ChillDev.
   Benang merah: surat → bola kertas → megafon → tanda tanya → bola salju → amplop ke PSSI.
   Semua gerak = fungsi murni dari t (seekTo). */
:root{--tA:#8E1424;--tB:#12050A;--red:#E2272F;--hot:#FF5A4A;--navy:#0D1F4A}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:100%;height:100%;background:#05070D;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;
  background:radial-gradient(ellipse 130% 62% at 50% 108%,var(--tA) 0%,var(--navy) 48%,var(--tB) 100%)}

#grain{position:absolute;inset:-60px;opacity:.12;mix-blend-mode:overlay;pointer-events:none;

<script>
(async () => {
'use strict';
await Promise.all([
  document.fonts.load("800 100px 'Barlow Condensed'"), document.fonts.load("italic 800 100px 'Barlow Condensed'"),
  document.fonts.load("700 100px 'Barlow Condensed'"), document.fonts.load("700 40px 'JetBrains Mono'"), document.fonts.load("800 40px 'JetBrains Mono'"),
]).catch(() => {});
const Q = new URLSearchParams(location.search);
const RENDER = Q.get('render') === '1', DEBUG = Q.get('debug') === '1';
const W = 1080, H = 1920, FPS = 30;

/* ============ SCENES ============
   BOUND = estimasi dari naskah (±5,4 suku kata/dtk + jeda). Setelah VO ada: ganti dengan titik tengah jeda. */
const BOUND = [0, 1.95, 8.27, 10.99, 12.65, 15.68, 20.94, 23.43, 28.39, 34.22, 40.14, 45.32, 49.40];
const NAMES = ['satu-surat', 'sekjen-dipecat', 'demi-organisasi', 'budi-melawan', 'tanya-anggaran', 'apbn-20-miliar', 'bola-salju', 'sepuluh-klub-klb', 'dua-alasan', 'exco-mundur', 'surat-ke-pssi', 'pssi-ngapain'];
const SCENES = NAMES.map((id, i) => ({ idx: i + 1, id, t0: BOUND[i], t1: BOUND[i + 1] }));
const T = i => SCENES[i - 1].t0;
const DURATION = BOUND[BOUND.length - 1];

/* ============ util deterministik ============ */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x, o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, i2: x => x * x, i3: x => x * x * x,
  io2: x => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2, io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  back: x => { const c = 1.9, c3 = c + 1; return 1 + c3 * (x - 1) ** 3 + c * (x - 1) ** 2; }
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const pos0 = v => Math.max(.001, v);

/* ============ titik penting dunia ============ */
const L0 = V(-2.0, 1.012, .1);           // tempat surat di meja FFI
const BOXP = V(12, .6, 0);                // kotak anggaran
const BALL_X0 = 13, BALL_X1 = 31, BALL_Z = 1.2, R0 = .15, R1 = .9;
const KR = (R1 - R0) / (BALL_X1 - BALL_X0);
const rAt = x => R0 + KR * (x - BALL_X0);
const ballX = t => t < T(7) + .5 ? BALL_X0 : lerp(BALL_X0, BALL_X1, E.io2(pr(t, T(7) + .5, T(8) + 2.75)));
const BADGE_X = [...Array(10)].map((_, i) => 16 + i * 1.65);
const BADGE_T = BADGE_X.map(x => { for (let t = T(7) + .5; t < T(8) + 2.95; t += 1 / 120) if (ballX(t) >= x - .2) return t; return T(8) + 2.75; });
const VOTERS = 58, LIT = 41;
const VORDER = [...Array(VOTERS).keys()].sort((a, b) => hash(a + 7) - hash(b + 7));
const vLitT = k => T(11) + .9 + k * .07;

/* ============ kamera ============ */
const K = [
  { t: 0, p: [1.6, 6.4, 8.6], l: [-.6, 1.2, 0] },
  { t: T(1) + 1.5, p: [-1.0, 4.4, 4.4], l: [-1.8, 1.0, 0], e: 'io2' },
  { t: T(2) + .8, p: [-2.0, 5.0, 1.75], l: [-2.0, 1.0, -.15], e: 'io3' },
  { t: T(2) + 3.2, p: [-2.0, 4.5, 1.6], l: [-2.0, 1.0, -.15], e: 'lin' },
  { t: T(3), p: [-2.0, 3.5, 1.3], l: [-2.0, 1.0, -.05], e: 'io2' },
  { t: T(3) + 2.4, p: [-2.05, 3.0, 1.12], l: [-2.0, 1.0, 0], e: 'lin' },
  { t: T(4) + .3, p: [-.8, 2.6, 3.4], l: [-1.9, 1.3, 0], e: 'io3' },
  { t: T(5) + .4, p: [-3.6, 2.0, 3.7], l: [-1.8, 2.0, 0], e: 'io2' },
  { t: T(5) + 2.8, p: [-3.2, 2.5, 3.4], l: [-1.6, 2.7, 0], e: 'lin' },
  { t: T(6) + .55, p: [12, 2.8, 8.4], l: [12, 2.2, 0], e: 'io3' },
  { t: T(6) + 3.1, p: [12, 2.5, 7.6], l: [12, 1.8, 0], e: 'lin' },
  { t: T(6) + 4.7, p: [12.3, 2.0, 4.9], l: [12.3, 1.0, 0], e: 'io2' },
  { t: T(7), p: [12.6, 1.7, 4.7], l: [12.8, .8, 0], e: 'lin' },
  { t: T(8) + 4.0, p: [31.5, 2.2, 6.2], l: [32.6, 1.6, 0], e: 'io2' },
  { t: T(9) + .3, p: [33.4, 2.4, 6.8], l: [33.4, 2.3, .6], e: 'io3' },
  { t: T(9) + 5.4, p: [33.4, 2.4, 6.1], l: [33.4, 2.3, .6], e: 'lin' },
  { t: T(10) + .55, p: [45, 3.2, 6.4], l: [45, 1.1, 0], e: 'io3' },
  { t: T(10) + 4.2, p: [44.6, 2.7, 5.4], l: [45, 1.1, -.3], e: 'lin' },
  { t: T(11) + .6, p: [60, 10.5, 7.2], l: [60, 0, .4], e: 'io3' },
  { t: T(11) + 3.0, p: [60, 9.6, 5.6], l: [60, .4, -.8], e: 'lin' },
  { t: T(11) + 4.9, p: [60, 4.3, -1.0], l: [60, 1.4, -8], e: 'io2' },
  { t: T(12) + 1.5, p: [60, 2.4, -4.4], l: [60, 1.1, -8], e: 'io3' },
  { t: DURATION, p: [60, 2.2, -4.9], l: [60, 1.2, -8], e: 'lin' },
];
function camKey(t) {
  let i = K.findIndex(k => k.t > t);
  if (i === -1) i = K.length - 1;
  if (i === 0) i = 1;
  const a = K[i - 1], b = K[i], k = E[b.e || 'io2'](pr(t, a.t, b.t));
  return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l.map((v, j) => lerp(v, b.l[j], k)) };
}
function camAt(t) {
  const c = camKey(t);
  // kamera mengikuti bola salju (scene 7–8), dicampur halus di tepi
  const w = E.io2(pr(t, T(7) + .25, T(7) + .9)) * (1 - E.io2(pr(t, T(8) + 3.05, T(8) + 3.75)));
  if (w > 0) {
    const bx = ballX(t), r = rAt(bx);
    const tp = [bx - 2.0, 1.5 + r * 1.1, 4.9 + r * 2.2], tlk = [bx + 1.3, .5 + r * .7, -.4];
    c.p = c.p.map((v, j) => lerp(v, tp[j], w)); c.l = c.l.map((v, j) => lerp(v, tlk[j], w));
  }
  return c;
}
const SHAKES = [];
const shakeAt = t => SHAKES.reduce((a, [s, amp]) => t >= s ? a + amp * Math.exp(-(t - s) * 9) : a, 0);

/* ============ HUD ============ */
const SAYS = [
  { s: 1, pos: 'top', at: .3, size: 104, txt: 'Semua bermula dari satu [surat]' },
  { s: 2, pos: 'bot', at: 3.7, size: 120, txt: 'Sekjen FFI [dipecat]' },
  { s: 3, pos: 'mid', at: .2, size: 124, txt: '“Demi [organisasi]”' },
  { s: 4, pos: 'top', at: .15, size: 112, txt: 'Tapi Budi nggak diam' },
  { s: 5, pos: 'bot', at: .5, size: 108, txt: 'Balik tanya soal [anggaran]' },
  { s: 6, pos: 'bot', at: 3.55, size: 104, txt: 'Budi minta semua [dibuka]' },
  { s: 7, pos: 'top', at: .3, size: 108, txt: 'Efeknya kayak [bola] [salju]' },
  { s: 8, pos: 'bot', at: .4, size: 108, txt: '10 klub satu suara: [KLB]' },
  { s: 9, pos: 'top', at: .3, size: 104, txt: 'Alasannya ada [dua]' },
  { s: 10, pos: 'top', at: .3, size: 108, txt: 'Beberapa Exco [mundur]' },
  { s: 11, pos: 'bot', at: .4, size: 108, txt: 'Surat menumpuk ke [PSSI]' },
  { s: 12, pos: 'mid', at: .1, size: 124, txt: 'Terus, PSSI [ngapain]?' },
];
const LABELS = [
  { s: 6, at: 2.1, out: 3.4, y: 280, txt: '+ UANG SPONSOR' },
  { s: 8, at: 3.2, out: 4.75, y: 280, txt: 'KLB · KONGRES LUAR BIASA' },
  { s: 11, at: 3.4, out: 4.95, y: 280, txt: 'SYARAT KLB: 2/3 SUARA' },
  { s: 12, at: 1.4, out: 99, y: 520, txt: 'LANJUT PART 3  →', center: true },
];
const LTS = [
  { s: 2, at: .9, out: 3.4, nm: 'Michael Sianipar', rl: 'KETUM FFI', top: true },
  { s: 2, at: 4.7, out: 6.25, nm: 'Budi Setiawan', rl: 'SEKJEN FFI', top: true },
  { s: 10, at: 2.2, out: 5.4, nm: 'Dimas Bagus Kurniawan', rl: 'PEMILIK BINTANG TIMUR SURABAYA' },
];

const tl = gsap.timeline({ paused: true });
const saysEl = document.getElementById('says');
SAYS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'say ' + d.pos; el.style.fontSize = d.size + 'px';
  el.innerHTML = d.txt.split(' ').map(w => {
    if (!/^\[.*\]/.test(w)) return `<span class="w"><span class="wi">${w}</span></span>`;
    const core = w.replace(/^\[(.*?)\].*$/, '$1'), tail = w.replace(/^\[(.*?)\]/, '');
    return `<span class="w hl"><i class="bar"></i><span class="wi">${core}</span>${tail}</span>`;
  }).join('');
  saysEl.appendChild(el);
  const at = T(d.s) + d.at, out = T(d.s) + (d.out ?? (SCENES[d.s - 1].t1 - T(d.s) - .32));
  const ws = el.querySelectorAll('.w');
  tl.fromTo(ws, { yPercent: 70, opacity: 0, filter: 'blur(14px)' }, { yPercent: 0, opacity: 1, filter: 'blur(0px)', duration: .55, ease: 'power4.out', stagger: .075 }, at);
  const bars = el.querySelectorAll('.bar');
  if (bars.length) tl.fromTo(bars, { scaleX: 0 }, { scaleX: 1, duration: .35, ease: 'power3.out', stagger: .1 }, at + ws.length * .075 + .15);
  if (d.s !== 12) tl.to(ws, { yPercent: -45, opacity: 0, filter: 'blur(10px)', duration: .32, ease: 'power2.in', stagger: .025 }, out);
});
LABELS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'lbl'; el.textContent = d.txt; el.style.top = d.y + 'px';
  if (d.center) { el.style.left = '50%'; el.style.transform = 'translateX(-50%)'; }
  saysEl.appendChild(el);
  tl.fromTo(el, { opacity: 0, clipPath: 'inset(0 100% 0 0)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: .45, ease: 'power3.out' }, T(d.s) + d.at);
  tl.to(el, { opacity: 0, duration: .25, ease: 'power2.in' }, T(d.s) + d.out - .25);
});
LTS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'lt'; if (d.top) { el.style.bottom = 'auto'; el.style.top = '96px'; } el.innerHTML = `<span class="nm">${d.nm}</span><span class="rl">${d.rl}</span>`;
  saysEl.appendChild(el);
  tl.fromTo(el, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: .5, ease: 'power3.out' }, T(d.s) + d.at);
  tl.to(el, { opacity: 0, x: -50, duration: .3, ease: 'power2.in' }, T(d.s) + d.out - .3);
});
tl.set({}, {}, DURATION);

/* ============ Three.js ============ */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070F26, 22, 60);
const cam = new THREE.PerspectiveCamera(50, W / H, .05, 200);
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x0d1f4a, .85); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, .9); dir.position.set(-4, 12, 7); scene.add(dir);
const redL = new THREE.PointLight(0xff2030, 0, 10); redL.position.set(0, 2.6, 1.2); scene.add(redL);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 8; return { c, g, tx };
}
function sprite(text, { size = 120, weight = 800, fam = 'Barlow Condensed', color = '#fff', bg = null, pad = 26, h = .6, border = null } = {}) {
  const m = document.createElement('canvas').getContext('2d'); m.font = `${weight} ${size}px '${fam}'`;
  const tw = Math.ceil(m.measureText(text).width) + pad * 2 + (border ? 12 : 0), th = Math.ceil(size * 1.25) + pad;
  const { tx } = canvasTex(tw, th, (g, w, hh) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, hh); }
    if (border) { g.fillStyle = border; g.fillRect(0, 0, 12, hh); }
    g.font = `${weight} ${size}px '${fam}'`; g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, pad + (border ? 12 : 0), hh / 2 + size * .04);
  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, transparent: true, depthWrite: false }));
  sp.scale.set(h * tw / th, h, 1); return sp;
}
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .6, ...o });
const gold = std(0xE7B530, { metalness: .55, roughness: .3, emissive: 0x4a3000 });
const flatOn = (m, x, y, z) => { m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); return m; };
function bumpy(geo, amt, seed) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 + amt * (hash(Math.round(x * 997) * 7 + Math.round(y * 991) * 13 + Math.round(z * 983) * 17 + seed) - .5);
    p.setXYZ(i, x * k, y * k, z * k);
  }
  geo.computeVertexNormals(); return geo;
}
const reveal = (geo, f, segs, rad) => geo.setDrawRange(0, Math.floor(cl(f) * segs) * rad * 6);

/* lantai + lampu dekor + debu naik */
const floorT = canvasTex(512, 512, (g, w, h) => { g.fillStyle = '#0B1736'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(110,150,255,.14)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h); });
floorT.tx.wrapS = floorT.tx.wrapT = THREE.RepeatWrapping; floorT.tx.repeat.set(60, 20);
scene.add(flatOn(new THREE.Mesh(new THREE.PlaneGeometry(240, 80), new THREE.MeshStandardMaterial({ map: floorT.tx, roughness: .9 })), 30, 0, 0));
[0, 12, 33.4, 45, 60].forEach(x => {
  const fx = new THREE.Mesh(new THREE.BoxGeometry(1.2, .22, .5), new THREE.MeshBasicMaterial({ color: 0xffffff })); fx.position.set(x, 8.6, -.4); scene.add(fx);
  const cone = new THREE.Mesh(new THREE.ConeGeometry(2.0, 8.4, 32, 1, true), new THREE.MeshBasicMaterial({ color: 0xBFD8FF, transparent: true, opacity: .05, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  cone.position.set(x, 4.4, -.4); scene.add(cone);

  });

  /* S6: pipa koin + kotak + kaca pembesar */
  const zoneB = t > T(5) + 3 && t < T(8) + 1;
  qBox.visible = zoneB; qBox.rotation.y = Math.sin(t * .8) * .08;
  qBox.scale.setScalar(1 + (t > T(7) && t < T(7) + .25 ? Math.sin(pr(t, T(7), T(7) + .25) * Math.PI) * .12 : 0));
  PIPES.forEach(P => {
    const f = E.io2(pr(t, P.t0, P.t0 + .9)); reveal(P.geo, f, 80, 12);
    P.mesh.visible = zoneB && f > 0; P.lab.visible = P.mesh.visible; P.lab.material.opacity = pr(t, P.t0, P.t0 + .4);
    P.coins.forEach((c, i) => {
      const u = ((t - P.t0 - .5) * .45 + i / 8) % 1;
      c.visible = zoneB && t > P.t0 + .5 + (1 - i / 8) * 0 && u >= 0 && u < f && t < T(7) + .1;
      if (c.visible) { c.position.copy(P.curve.getPoint(u)); c.rotation.set(t * 4 + i, 0, t * 3 + i); }
    });
  });
  const mgk = pr(t, T(6) + 3.5, T(6) + 5.1);
  mag.visible = mgk > 0 && mgk < 1; mag.position.set(lerp(11.2, 12.9, E.io2(mgk)), 1.05 + Math.sin(mgk * Math.PI * 2) * .12, .95); mag.rotation.y = -.2;

  /* S7: tanda tanya jatuh → bola salju */
  const qk = pr(t, T(7), T(7) + .5);
  qDrop.visible = qk > 0 && qk < 1;
  qDrop.position.copy(bez(V(12, 1.4, 0), V(12.6, 2.8, .6), V(BALL_X0, .25, BALL_Z), E.i2(qk))); qDrop.material.opacity = 1 - pr(t, T(7) + .38, T(7) + .5);
  const bx = ballX(t), r = rAt(bx) * E.back(pr(t, T(7) + .4, T(7) + .65));
  snow.visible = t > T(7) + .4; snow.scale.setScalar(pos0(r)); snow.position.set(bx, r, BALL_Z);
  snow.rotation.set(0, 0, -Math.log(rAt(bx) / R0) / KR);
  snowSh.visible = snow.visible; snowSh.position.x = bx; snowSh.scale.setScalar(pos0(r * 1.05));
  BADGES.forEach(B => {
    const on = t >= B.t; B.face.material = on ? B.on : B.off;
    const pop = on ? Math.exp(-(t - B.t) * 7) * Math.sin((t - B.t) * 22) * .18 : 0;
    B.g.scale.setScalar(1 + pop); B.g.rotation.y = on ? -.15 : 0;
    B.g.visible = t > T(6) + 4 && t < T(10) + .5;
  });
  const kk = E.back(pr(t, T(8) + 2.9, T(8) + 3.35)) * (1 - E.i2(pr(t, T(9) - .1, T(9) + .3)));
  klb.visible = kk > 0.002 && t < T(9) + .3; klb.scale.set(1.25 * kl.aspect * pos0(kk), 1.25 * pos0(kk), 1);
  klb.material.rotation = Math.sin(t * 2) * .03;
  CARDS.forEach((c, i) => {
    const k = pr(t, c.ts, c.ts + .7);
    c.piv.visible = k > 0 && t < T(10) + .6; c.piv.rotation.y = lerp(-Math.PI / 2, 0, E.back(k)) + Math.sin(t * 1.3 + i) * .04;
    c.piv.position.y = c.y + Math.sin(t * 1.7 + i * 2) * .04;
  });

  /* S10: kursi Exco keluar */
  exco.visible = t > T(9) + 3 && t < T(11) + 1;
  CHAIRS.forEach((c, i) => {
    const k = c.out ? E.i2(pr(t, c.out, c.out + .55)) : 0;
    c.g.position.set(c.x + k * (i < 3 ? -.8 : .8), k * .1, -1.15 - k * 3.2); c.g.rotation.y = k * (i < 3 ? 1.2 : -1.2); c.g.visible = k < 1;
  });

  /* S11: pemilik suara menyala, amplop terbang ke PSSI */
  const zoneE = t > T(10) + 3;
  let nLit = 0;
  VOTE.forEach((m, i) => {
    m.visible = zoneE; const k = VLIT[i]; const on = k !== undefined && t >= vLitT(k);
    if (on) nLit++;
    m.material.color.setHex(on ? 0xE2272F : 0x2A3A6E); m.material.emissive.setHex(on ? 0x400000 : 0);
    m.scale.y = on ? 1 + Math.exp(-(t - vLitT(k)) * 8) * 1.8 : 1;
  });
  pssi.visible = zoneE;
  ENVS.forEach((e, k) => {
    const f = pr(t, e.ts, e.ts + 1.1); e.m.visible = zoneE && f > 0;
    if (!e.m.visible) return;
    const st = VOTE[e.v].position.clone().add(V(0, .2, 0)), mid = st.clone().lerp(e.end, .5).add(V(0, 3.4, 0));
    e.m.position.copy(bez(st, mid, e.end, E.io2(f)));
    e.m.rotation.set(lerp(-.4, -Math.PI / 2, E.i2(f)), e.yaw + (1 - f) * 5, (1 - f) * 2);
  });
  const gk = E.o3(pr(t, T(12) + .7, T(12) + 1.6));
  gavel.visible = gk > 0; gavel.position.set(60.1, lerp(6.5, 2.0, gk) + Math.sin(t * 2.2) * .05, -8.0); gavel.rotation.set(0, -.5, -.35 + Math.sin(t * 1.6) * .06);

  /* stat HUD */
  let sv = null;
  if (t > T(6) + .6 && t < T(7) - .15) sv = ['Rp ' + Math.round(20 * E.o2(pr(t, T(6) + .6, T(6) + 1.8))) + ' M', 'DANA APBN'];
  else if (t > T(8) + .2 && t < T(9) + .2) sv = [String(BADGES.filter(B => t >= B.t).length), 'KLUB PFL'];
  else if (t > T(11) + .8 && t < T(12) + .1) sv = [nLit > 40 ? '40+' : String(nLit), '/ 58 PEMILIK SUARA'];
  if (sv) { statN.textContent = sv[0]; statU.textContent = sv[1]; }
  const sIn = Math.max(pr(t, T(6) + .6, T(6) + .9) * (1 - pr(t, T(7) - .4, T(7) - .15)), pr(t, T(8) + .2, T(8) + .5) * (1 - pr(t, T(9) - .05, T(9) + .2)), pr(t, T(11) + .8, T(11) + 1.1) * (1 - pr(t, T(12) - .2, T(12) + .1)));
  statEl.style.opacity = sIn.toFixed(3); statEl.style.transform = `translateX(${((1 - sIn) * -50).toFixed(1)}px)`;

  /* flash */
  let fl = 0;
  if (t >= STAMP_T + .18) fl = Math.max(fl, .3 * Math.exp(-(t - STAMP_T - .18) * 7));
  if (t >= T(8) + 2.95) fl = Math.max(fl, .22 * Math.exp(-(t - T(8) - 2.95) * 7));
  flashEl.style.opacity = fl.toFixed(3);

  const [a, b] = tintAt(t); stage.style.setProperty('--tA', a); stage.style.setProperty('--tB', b);
  grain.style.transform = `translate(${Math.round(Math.sin(t * 37) * 30)}px, ${Math.round(Math.cos(t * 29) * 30)}px)`;
}
const kl = { aspect: klb.scale.x / klb.scale.y };

/* ============ seek ============ */
const lookV = V(0, 0, 0);
function applyCam(t) {
  const c = camAt(t), c2 = camAt(Math.max(0, t - 1 / FPS));
  const br = [Math.sin(t * .7) * .06, Math.sin(t * .9) * .05, Math.cos(t * .6) * .05];
  const sh = shakeAt(t), sv = [Math.sin(t * 53) * sh, Math.sin(t * 61 + 1) * sh, Math.sin(t * 47 + 2) * sh];
  cam.position.set(c.p[0] + br[0] + sv[0], c.p[1] + br[1] + sv[1], c.p[2] + br[2]);
  lookV.set(c.l[0] + sv[2], c.l[1], c.l[2]); cam.lookAt(lookV);
  const sp = Math.hypot(c.p[0] - c2.p[0], c.p[1] - c2.p[1], c.p[2] - c2.p[2]) + .5 * Math.hypot(c.l[0] - c2.l[0], c.l[1] - c2.l[1], c.l[2] - c2.l[2]);
  const blur = cl((sp - .3) * 7, 0, 9);
  glEl.style.filter = blur > .2 ? `blur(${blur.toFixed(1)}px)` : 'none';
}
let curT = 0;
function seekTimeline(t) {
  curT = cl(t, 0, DURATION);
  tl.seek(curT, false); update(curT); applyCam(curT); renderer.render(scene, cam);
  if (DEBUG) { dr.value = curT; dt.textContent = curT.toFixed(2) + ' / ' + DURATION.toFixed(2) + ' · ' + (SCENES.find(s => curT >= s.t0 && curT < s.t1) || SCENES.at(-1)).id; }
}
window.seekTo = sec => seekTimeline(sec);

/* ============ SFX (dicampur render.mjs) ============ */
const SFX = [
  { t: .12, file: 'sfx_whoosh.wav', vol: .15 }, { t: T(1) + 1.35, file: 'sfx_click.wav', vol: .14 },
  { t: T(2) + .15, file: 'sfx_whoosh.wav', vol: .14 }, { t: STAMP_T + .18, file: 'sfx_glitch.wav', vol: .15 },
  { t: T(4) + .3, file: 'sfx_whoosh.wav', vol: .14 }, { t: T(4) + .8, file: 'sfx_pop.wav', vol: .15 },
  { t: T(5) + .35, file: 'sfx_pop.wav', vol: .15 }, ...QS.map(q => ({ t: q.ts, file: 'sfx_click.wav', vol: .14 })),
  { t: T(6) + .1, file: 'sfx_whoosh.wav', vol: .15 }, { t: T(6) + 1.8, file: 'sfx_success.wav', vol: .14 },
  { t: T(6) + 3.5, file: 'sfx_whoosh.wav', vol: .14 }, { t: T(7) + .05, file: 'sfx_pop.wav', vol: .15 },
  ...BADGE_T.map(bt => ({ t: bt, file: 'sfx_click.wav', vol: .14 })), { t: T(8) + 2.95, file: 'sfx_pop.wav', vol: .16 },
  { t: T(9) + .9, file: 'sfx_whoosh.wav', vol: .14 }, { t: T(9) + 2.55, file: 'sfx_whoosh.wav', vol: .14 },
  { t: T(10) + .1, file: 'sfx_whoosh.wav', vol: .15 }, ...CHAIRS.filter(c => c.out).map(c => ({ t: c.out, file: 'sfx_glitch.wav', vol: .14 })),
  { t: T(11) + .1, file: 'sfx_whoosh.wav', vol: .15 }, ...[0, 8, 16, 24, 32, 40].map(k => ({ t: vLitT(k), file: 'sfx_click.wav', vol: .14 })),
  { t: T(12) + .2, file: 'sfx_whoosh.wav', vol: .14 }, { t: T(12) + 1.6, file: 'sfx_pop.wav', vol: .15 },
];

/* ============ tampilan & preview ============ */
function fit() { const s = RENDER ? 1 : Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${s})`; stage.style.left = RENDER ? '0' : ((innerWidth - W * s) / 2) + 'px'; }
addEventListener('resize', fit); fit();
const dr = document.getElementById('dbg-r'), dt = document.getElementById('dbg-t');
let playing = !RENDER && Q.get('t') === null, wall = 0, from = 0;
if (DEBUG) { document.body.classList.add('debug'); dr.max = DURATION; dr.oninput = e => { playing = false; seekTimeline(+e.target.value); }; }
const vo = new Audio('vo.mp3'); vo.preload = 'auto';
function loop(now) {
  if (!playing) return;
  let t = from + (now - wall) / 1000;
  if (t >= DURATION + .8) { from = 0; wall = now; t = 0; try { vo.currentTime = 0; } catch (e) {} }
  seekTimeline(Math.min(t, DURATION)); requestAnimationFrame(loop);
}
function play() { playing = true; wall = performance.now(); from = curT >= DURATION ? 0 : curT; try { vo.currentTime = from; vo.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }
function pause() { playing = false; try { vo.pause(); } catch (e) {} }
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'r' || e.key === 'R') { seekTimeline(0); pause(); play(); }
});
document.getElementById('dbg-play').onclick = () => playing ? pause() : play();

window.OPENER = { ready: false, DURATION, FPS, WIDTH: W, HEIGHT: H, SCENES, SFX, seek: s => window.seekTo(s) };
seekTimeline(Number(Q.get('t')) || 0);
window.OPENER.ready = true;
if (playing) play();
})();
</script>
