<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Cover Part 2</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070F26;font-family:'Barlow Condensed',sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:url(bg-part-2.png) center/cover;transform:scale(1.2);transform-origin:50% 40%;filter:saturate(1.2) contrast(1.08)}
.sc{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,10,28,.55) 0%,rgba(5,10,28,0) 16%,rgba(5,10,28,0) 40%,rgba(5,10,28,.9) 60%,rgba(5,10,28,.97) 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 38%,transparent 50%,rgba(0,0,0,.55))}
.top{position:absolute;left:80px;right:130px;top:200px;display:flex;justify-content:space-between;align-items:center}
.badge{display:flex;font:800 46px 'Barlow Condensed';letter-spacing:.06em;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.badge b{background:#E2272F;padding:6px 22px}.badge span{background:#fff;color:#0D1F4A;padding:6px 22px}
.h{font:800 28px 'JetBrains Mono';background:rgba(0,0,0,.35);padding:8px 16px;border-radius:99px}
.txt{position:absolute;left:80px;right:130px;bottom:470px;display:flex;flex-direction:column;gap:30px}
.t{font-weight:800;line-height:.92;letter-spacing:-.01em;text-shadow:0 8px 34px rgba(0,0,0,.6)}
.t .a{display:block;font-size:150px;white-space:nowrap}
.t .b{display:block;font-size:168px;white-space:nowrap;margin-top:6px}
.hl{background:#E2272F;padding:0 .12em;display:inline-block;transform:skewX(-6deg)}
.sub{font:700 50px/1.15 'Barlow Condensed';color:#DCE5FA;border-left:8px solid #E2272F;padding-left:22px}
</style></head><body>
<div class="bg"></div><div class="sc"></div><div class="vig"></div>
<div class="top"><div class="badge"><b>PART 2</b><span>FUTSAL INDONESIA</span></div><div class="h">@ramarvctr_</div></div>
<div class="txt"><div class="t"><span class="a">Sekjen dipecat,</span><span class="b">semua <span class="hl">kebongkar</span></span></div><div class="sub">Anggaran Rp20 miliar dipertanyakan,<br>10 klub desak KLB</div></div>
<script>document.fonts.ready.then(()=>{const box=document.querySelector('.t');const W=box.clientWidth-20;document.querySelectorAll('.t .a,.t .b').forEach(el=>{el.style.display='inline-block';let f=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>W&&f>60){f-=2;el.style.fontSize=f+'px';}el.style.display='block';});});</script></body></html>
