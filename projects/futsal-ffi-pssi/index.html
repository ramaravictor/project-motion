<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timnas Futsal · Part 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Part 1 · "Timnas lagi terbang, federasinya malah ribut"
   Gaya: Opsi B, arena 3D siaran TV. Tanpa template ChillDev (permintaan user):
   tanpa header/kartu/Rama. Semua gerak = fungsi murni dari t (seekTo). */
:root{--tA:#1E5BD8;--tB:#070F26;--red:#E2272F;--hot:#FF5A4A;--navy:#0D1F4A}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:100%;height:100%;background:#05070D;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;
  background:radial-gradient(ellipse 130% 62% at 50% 108%,var(--tA) 0%,var(--navy) 48%,var(--tB) 100%)}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
.scrim{position:absolute;left:0;right:0;pointer-events:none}
.scrim.top{top:0;height:600px;background:linear-gradient(to bottom,rgba(5,10,28,.82),rgba(5,10,28,0))}
.scrim.bot{bottom:0;height:880px;background:linear-gradient(to top,rgba(5,10,28,.94) 0%,rgba(5,10,28,.62) 42%,rgba(5,10,28,0) 100%)}
#grain{position:absolute;inset:-60px;opacity:.12;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 72% at 50% 46%,transparent 52%,rgba(0,0,0,.5))}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* HUD = safe zone 80/180/130/450 */
#hud{position:absolute;top:180px;left:80px;width:870px;height:1290px;font-family:'Barlow Condensed',sans-serif;color:#fff}
.topbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center}
.pill{font:800 30px 'Barlow Condensed';letter-spacing:.06em;background:var(--red);padding:6px 18px 5px;border-radius:8px;white-space:nowrap;display:flex;gap:12px;align-items:center}
.pill .dot{width:12px;height:12px;border-radius:50%;background:#fff}
.handle{font:700 24px 'JetBrains Mono';display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);padding:6px 14px 6px 8px;border-radius:99px;white-space:nowrap}
.handle img{width:30px;height:30px}

#bug{position:absolute;top:78px;left:0;display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.4);opacity:0}
#bug .tm{background:#fff;color:#0D1F4A;font:800 46px 'Barlow Condensed';padding:2px 16px;display:flex;align-items:center;gap:12px;letter-spacing:.03em}
#bug .fl{width:38px;height:26px;border:1px solid #c9cfdc;display:inline-block}
.f-idn{background:linear-gradient(#E2272F 50%,#fff 50%)}
.f-tha{background:linear-gradient(#E2272F 0 17%,#fff 17% 33%,#24307A 33% 67%,#fff 67% 83%,#E2272F 83%)}
.f-irn{background:linear-gradient(#239F40 0 33%,#fff 33% 67%,#DA0000 67%)}
#bug .sc{background:var(--red);font:800 52px 'Barlow Condensed';padding:0 20px;display:flex;align-items:center;font-variant-numeric:tabular-nums;min-width:118px;justify-content:center}
#bug .tg{background:#0D1F4A;color:#9CC2FF;font:700 30px 'Barlow Condensed';letter-spacing:.08em;padding:0 16px;display:flex;align-items:center;white-space:nowrap}

.say{position:absolute;left:0;width:870px;font-weight:800;line-height:.98;letter-spacing:-.005em;text-shadow:0 6px 26px rgba(0,0,0,.45)}
.say.top{top:170px}.say.bot{bottom:24px}.say.mid{top:300px;text-align:center}
.w{display:inline-block;position:relative;margin-right:.22em;white-space:nowrap}
.w .wi{display:inline-block;position:relative;z-index:1}
.w .bar{position:absolute;left:-.1em;right:-.1em;top:.08em;bottom:-.02em;background:var(--red);transform-origin:0 50%;transform:scaleX(0) skewX(-8deg);z-index:0}
.w.gold .bar{background:#C8902A}
.lbl{position:absolute;left:0;font:800 34px 'JetBrains Mono';letter-spacing:.04em;color:#fff;background:rgba(13,31,74,.86);border-left:8px solid var(--red);padding:10px 18px;white-space:nowrap;opacity:0}

#lt{position:absolute;left:0;bottom:250px;display:flex;flex-direction:column;align-items:flex-start;opacity:0}
#lt .nm{font:800 74px 'Barlow Condensed';background:#fff;color:#0D1F4A;padding:0 22px;line-height:1.15}
#lt .rl{font:700 34px 'JetBrains Mono';background:var(--red);padding:6px 22px;letter-spacing:.04em}

#dbg{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.75);font:600 13px monospace;color:#ddd;z-index:9}
#dbg input{flex:1}
body.debug #dbg{display:flex}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="scrim top"></div><div class="scrim bot"></div>
  <div id="vig"></div><div id="grain"></div><div id="flash"></div>
  <div id="hud">
    <div class="topbar">
      <div class="pill"><span class="dot"></span>TIMNAS FUTSAL · PART 1</div>
      <div class="handle"><img src="../_shared/brand/logo-instagram.svg" alt=""><span>@ramarvctr_</span></div>
    </div>
    <div id="bug"><span class="tm"><i class="fl f-idn"></i>IDN</span><span class="sc" id="bug-sc">0–0</span><span class="tm" id="bug-op"><i class="fl f-tha"></i>THA</span><span class="tg" id="bug-tg">FINAL</span></div>
    <div id="says"></div>
    <div id="lt"><span class="nm">Hector Souto</span><span class="rl">PELATIH TIMNAS FUTSAL</span></div>
  </div>
</div>
<div id="dbg"><button id="dbg-play">❚❚</button><input id="dbg-r" type="range" min="0" step="0.01"><span id="dbg-t"></span></div>

<script>
(async () => {
'use strict';
await Promise.all([
  document.fonts.load("800 100px 'Barlow Condensed'"), document.fonts.load("italic 800 100px 'Barlow Condensed'"),
  document.fonts.load("700 100px 'Barlow Condensed'"), document.fonts.load("700 40px 'JetBrains Mono'"),
]).catch(() => {});
const Q = new URLSearchParams(location.search);
const RENDER = Q.get('render') === '1', DEBUG = Q.get('debug') === '1';
const W = 1080, H = 1920, FPS = 30;

/* ============ SCENES ============
   Durasi = estimasi dari naskah (±2,5 kata/dtk + jeda 0,4 dtk).
   Setelah VO ada: ganti D dengan batas dari silencedetect; semua animasi relatif ke t0 scene. */
const BOUND = [0, 4.76, 8.72, 12.40, 18.34, 23.87, 29.28, 34.18, 38.07, 43.30, 48.83, 51.60];
const D = BOUND.slice(1).map((b, i) => b - BOUND[i]);
const NAMES = ['hook-gacor', 'rumah-kebakaran', 'mundur-sea-games', 'final-6-1-emas', 'juara-china', 'indonesia-arena', 'final-pertama-iran', 'lima-lima-penalti', 'target-2028', 'ffi-vs-pssi', 'lanjut-part-2'];
const SCENES = D.map((d, i) => ({ idx: i + 1, id: NAMES[i], t0: BOUND[i], t1: BOUND[i + 1] }));
const HIT = 3.5; // "gacor" diucapkan ±3,6 dtk
const T = i => SCENES[i - 1].t0;
const DURATION = SCENES[SCENES.length - 1].t1;

/* ============ util deterministik ============ */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const pr = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x, o2: x => 1 - (1 - x) ** 2, o3: x => 1 - (1 - x) ** 3, o4: x => 1 - (1 - x) ** 4, i2: x => x * x, i3: x => x * x * x,
  io2: x => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2, io3: x => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  back: x => { const c = 1.9, c3 = c + 1; return 1 + c3 * (x - 1) ** 3 + c * (x - 1) ** 2; }
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const between = (t, a, b) => t >= a && t < b;

/* ============ kamera: keyframe (posisi, titik lihat, up) ============ */
const K = [
  { t: 0, p: [-6.4, 1.4, 4.3], l: [-1, .7, -.4] },
  { t: HIT - .1, p: [-3.8, 2.1, 4.6], l: [2.6, 1.1, 0], e: 'io2' },
  { t: T(2), p: [-3.6, 3.0, 4.6], l: [2.0, 1.4, 0], e: 'o2' },
  { t: T(2) + 2.2, p: [-1.8, 7.4, 11.6], l: [1.6, 7.4, -.4], e: 'io2' },
  { t: T(3) - .15, p: [-3.8, 10.4, 14.4], l: [2.4, 9.5, -.6], e: 'io2' },
  { t: T(3) + .75, p: [0, 17.5, .01], l: [0, 0, 0], u: [1, 0, 0], e: 'io3' },
  { t: T(4), p: [0, 15.4, .01], l: [0, 0, 0], u: [1, 0, 0], e: 'lin' },
  { t: T(4) + .8, p: [-8.6, 10.4, 13.4], l: [1.2, 0, 0], e: 'io3' },
  { t: T(4) + 2.9, p: [-4.2, 6.4, 9.2], l: [4.2, .5, 0], e: 'io2' },
  { t: T(4) + 4.0, p: [.5, 2.5, 6.0], l: [2.2, 1.6, .4], e: 'io3' },
  { t: T(5), p: [.4, 2.35, 5.3], l: [2.2, 1.55, .4], e: 'lin' },
  { t: T(5) + 1.3, p: [1.2, 4.6, 1.2], l: [1.0, 3.8, -7], e: 'io2' },
  { t: T(5) + 2.4, p: [0, 6.9, -12.4], l: [0, 7.3, -24], e: 'io3' },
  { t: T(6), p: [.4, 7.2, -13.2], l: [.3, 7.6, -24], e: 'lin' },
  { t: T(6) + .8, p: [0, 3.0, 27.5], l: [0, 4.0, 16], e: 'io3' },
  { t: T(6) + 1.6, p: [0, 2.8, 23.5], l: [0, 3.5, 10], e: 'o2' },
  { t: T(6) + 2.6, p: [0, 2.1, 9.0], l: [0, 1.8, -2], e: 'i2' },
  { t: T(6) + 3.7, p: [0, 4.2, 3.6], l: [0, 2.2, -4], e: 'o2' },
  { t: T(7), p: [-6.8, 10.4, 13.2], l: [.4, .6, 0], e: 'io2' },
  { t: T(7) + .8, p: [0, 6.6, 9.4], l: [0, 6.4, -4.8], e: 'io3' },
  { t: T(7) + 2.8, p: [0, 7.4, 7.8], l: [0, 7.2, -4.8], e: 'io2' },
  { t: T(8) - .1, p: [0, 9.0, 7.0], l: [0, 9.2, -4.8], e: 'io2' },
  { t: T(8) + .6, p: [-1.8, 6.2, 9.4], l: [0, 6.1, 0], e: 'io3' },
  { t: T(8) + 2.6, p: [-1.3, 6.3, 8.6], l: [0, 6.2, 0], e: 'lin' },
  { t: T(9), p: [-5, 8.5, 11], l: [0, 4.8, 0], e: 'io2' },
  { t: T(9) + .8, p: [0, 17.5, .01], l: [0, 0, 0], u: [1, 0, 0], e: 'io3' },
  { t: T(9) + 2.6, p: [0, 16.4, .01], l: [.6, 0, 0], u: [1, 0, 0], e: 'lin' },
  { t: T(9) + 3.8, p: [3.4, 3.9, 4.4], l: [8.1, 1.8, 0], e: 'io3' },
  { t: T(10), p: [4.5, 3.4, 3.3], l: [8.1, 2.0, 0], e: 'lin' },
  { t: T(10) + 1.5, p: [0, 19.6, 10.2], l: [0, 15.8, 0], e: 'io3' },
  { t: T(11), p: [0, 19.2, 9.2], l: [0, 15.9, 0], e: 'lin' },
  { t: DURATION, p: [0, 18.9, 8.6], l: [0, 16.3, 0], e: 'lin' },
];
function camAt(t) {
  let i = K.findIndex(k => k.t > t);
  if (i === -1) i = K.length - 1;
  if (i === 0) i = 1;
  const a = K[i - 1], b = K[i];
  const k = E[b.e || 'io2'](pr(t, a.t, b.t));
  const ua = a.u || [0, 1, 0], ub = b.u || [0, 1, 0];
  return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l.map((v, j) => lerp(v, b.l[j], k)), u: ua.map((v, j) => lerp(v, ub[j], k)) };
}
// getar: impuls yang meluruh (detik, kekuatan)
const SHAKES = [];
function shakeAt(t) { let a = 0; SHAKES.forEach(([s, amp]) => { if (t >= s) a += amp * Math.exp(-(t - s) * 9); }); return a; }

/* ============ HUD: kalimat per kata ============
   [kata] = sorotan bar merah (gold: {kata}). Waktu lokal terhadap t0 scene. */
const SAYS = [
  { s: 1, pos: 'bot', at: .35, size: 98, txt: 'Dua tahun ini, Timnas Futsal Indonesia lagi' },
  { s: 2, pos: 'bot', at: .2, size: 104, txt: 'Tapi rumahnya sendiri malah [kebakaran]' },
  { s: 3, pos: 'top', at: .25, size: 104, txt: 'Kita mundur dulu' },
  { s: 4, pos: 'bot', at: .3, out: 3.25, size: 108, txt: 'Final lawan tuan rumah, menang [6–1]' },
  { s: 4, pos: 'bot', at: 3.45, size: 104, txt: 'Emas futsal {pertama} di SEA Games' },
  { s: 5, pos: 'top', at: 1.2, size: 112, txt: 'Lalu [juara] di China' },
  { s: 6, pos: 'bot', at: 2.9, size: 104, txt: 'Piala Asia 2026, di [kandang] [sendiri]' },
  { s: 7, pos: 'top', at: .3, out: 3.0, size: 104, txt: 'Pertama kalinya tembus [final]' },
  { s: 8, pos: 'bot', at: .25, size: 112, txt: '[5–5], kalah tipis di adu penalti' },
  { s: 9, pos: 'top', at: .6, out: 2.7, size: 104, txt: 'Target: Piala Dunia [2028]' },
  { s: 10, pos: 'bot', at: .4, out: 3.2, size: 104, txt: 'Masalahnya, ada perang dingin' },
  { s: 10, pos: 'bot', at: 3.4, size: 150, txt: '[FFI] vs [PSSI]' },
  { s: 11, pos: 'mid', at: .1, size: 124, txt: 'Gimana awalnya?' },
];
const LABELS = [
  { s: 3, at: 1.6, out: 3.6, y: 300, txt: 'FINAL · NONTHABURI, THAILAND' },
  { s: 5, at: 4.4, out: 5.4, y: 300, txt: 'CFA INTERNATIONAL 2025 · 4–2 DENMARK' },
  { s: 7, at: 3.1, out: 4.3, y: 170, txt: 'IRAN · 13× JUARA ASIA' },
  { s: 11, at: 1.5, out: 99, y: 470, txt: 'LANJUT PART 2  →', center: true },
];

const tl = gsap.timeline({ paused: true });
const saysEl = document.getElementById('says');
SAYS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'say ' + d.pos; el.style.fontSize = d.size + 'px';
  const toks = d.txt.split(' ');
  el.innerHTML = toks.map(w => {
    const hl = /^\[.*\]/.test(w) ? 'hl' : /^\{.*\}/.test(w) ? 'hl gold' : '';
    const tail = w.replace(/^[\[{](.*?)[\]}]/, '').trim();
    const core = w.replace(/^[\[{](.*?)[\]}].*$/, '$1');
    return hl ? `<span class="w ${hl}"><i class="bar"></i><span class="wi">${core}</span>${tail}</span>` : `<span class="w"><span class="wi">${w}</span></span>`;
  }).join('');
  saysEl.appendChild(el);
  const at = T(d.s) + d.at, out = T(d.s) + (d.out ?? (SCENES[d.s - 1].t1 - T(d.s) - .32));
  const ws = el.querySelectorAll('.w');
  tl.fromTo(ws, { yPercent: 70, opacity: 0, filter: 'blur(14px)' }, { yPercent: 0, opacity: 1, filter: 'blur(0px)', duration: .55, ease: 'power4.out', stagger: .075 }, at);
  const bars = el.querySelectorAll('.bar');
  if (bars.length) tl.fromTo(bars, { scaleX: 0 }, { scaleX: 1, duration: .35, ease: 'power3.out', stagger: .1 }, at + ws.length * .075 + .15);
  if (d.s !== 11) tl.to(ws, { yPercent: -45, opacity: 0, filter: 'blur(10px)', duration: .32, ease: 'power2.in', stagger: .025 }, out);
});
LABELS.forEach(d => {
  const el = document.createElement('div');
  el.className = 'lbl'; el.textContent = d.txt; el.style.top = d.y + 'px';
  if (d.center) { el.style.left = '50%'; el.style.transform = 'translateX(-50%)'; }
  saysEl.appendChild(el);
  tl.fromTo(el, { opacity: 0, clipPath: 'inset(0 100% 0 0)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0)', duration: .45, ease: 'power3.out' }, T(d.s) + d.at);
  tl.to(el, { opacity: 0, duration: .25, ease: 'power2.in' }, T(d.s) + d.out - .25);
});
// score bug
const bug = document.getElementById('bug');
tl.fromTo(bug, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: .45, ease: 'power3.out' }, T(3) + 1.2);
tl.to(bug, { opacity: 0, x: -40, duration: .3, ease: 'power2.in' }, T(5) + .4);
tl.fromTo(bug, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: .45, ease: 'power3.out', immediateRender: false }, T(8) + .1);
tl.to(bug, { opacity: 0, x: -40, duration: .3, ease: 'power2.in' }, T(9) + .3);
// lower third
const lt = document.getElementById('lt');
tl.fromTo(lt, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: .5, ease: 'power3.out' }, T(9) + .4);
tl.to(lt, { opacity: 0, x: -50, duration: .3, ease: 'power2.in' }, T(9) + 2.75);
tl.set({}, {}, DURATION);

/* ============ Three.js dunia ============ */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070F26, 30, 70);
const cam = new THREE.PerspectiveCamera(50, W / H, .1, 200);
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x0d1f4a, .9); scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff, .9); dir.position.set(-4, 12, 7); scene.add(dir);
const fire = new THREE.PointLight(0xff5a2a, 0, 9); scene.add(fire);
const redL = new THREE.PointLight(0xff2030, 0, 14); redL.position.set(0, 19, 3); scene.add(redL);

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const tx = new THREE.CanvasTexture(c); tx.anisotropy = 8;
  return { c, g, tx };
}
function sprite(text, { size = 120, weight = 800, fam = 'Barlow Condensed', color = '#fff', bg = null, pad = 26, h = .6, border = null } = {}) {
  const tmp = document.createElement('canvas').getContext('2d');
  tmp.font = `${weight} ${size}px '${fam}'`;
  const tw = Math.ceil(tmp.measureText(text).width) + pad * 2, th = Math.ceil(size * 1.25) + pad;
  const { tx } = canvasTex(tw, th, (g, w, hh) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, hh); }
    if (border) { g.fillStyle = border; g.fillRect(0, 0, 12, hh); }
    g.font = `${weight} ${size}px '${fam}'`; g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, pad + (border ? 6 : 0), hh / 2 + size * .04);
  });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tx, transparent: true, depthWrite: false }));
  sp.scale.set(h * tw / th, h, 1); return sp;
}
const gold = new THREE.MeshStandardMaterial({ color: 0xE7B530, metalness: .55, roughness: .3, emissive: 0x4a3000 });

/* lantai luar + lapangan */
const apron = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ color: 0x0B1736, roughness: .9 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = -.02; scene.add(apron);
const courtTex = canvasTex(2048, 1170, (g, w, h) => {
  for (let x = 0; x < w; x += 64) { g.fillStyle = (x / 64) % 2 ? '#2D6BDB' : '#3172E4'; g.fillRect(x, 0, 64, h); }
  const m = 46, s = (w - 2 * m) / 14; g.strokeStyle = '#fff'; g.lineWidth = 9;
  g.strokeRect(m, m, w - 2 * m, h - 2 * m);
  g.beginPath(); g.moveTo(w / 2, m); g.lineTo(w / 2, h - m); g.stroke();

function makeBall() {
  const geo = new THREE.IcosahedronGeometry(.32, 2).toNonIndexed();
  const ico = new THREE.IcosahedronGeometry(1, 0), vp = ico.attributes.position, verts = [];
  for (let i = 0; i < vp.count; i++) { const v = V(vp.getX(i), vp.getY(i), vp.getZ(i)).normalize(); if (!verts.some(u => u.distanceTo(v) < .01)) verts.push(v); }
  const pos = geo.attributes.position, col = [];
  for (let f = 0; f < pos.count; f += 3) {
    const c = V(0, 0, 0); for (let k = 0; k < 3; k++) c.add(V(pos.getX(f + k), pos.getY(f + k), pos.getZ(f + k)));
    c.normalize(); const dark = verts.some(v => v.dot(c) > .93);
    for (let k = 0; k < 3; k++) col.push(...(dark ? [.07, .09, .14] : [1, 1, 1]));
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .3, flatShading: true }));
}

  cam.position.set(c.p[0] + br[0] + sv[0], c.p[1] + br[1] + sv[1], c.p[2] + br[2]);
  cam.up.set(...c.u).normalize(); lookV.set(c.l[0] + sv[2], c.l[1], c.l[2]); cam.lookAt(lookV);
  const sp = Math.hypot(c.p[0] - c2.p[0], c.p[1] - c2.p[1], c.p[2] - c2.p[2]) + .5 * Math.hypot(c.l[0] - c2.l[0], c.l[1] - c2.l[1], c.l[2] - c2.l[2]);
  const blur = cl((sp - .3) * 7, 0, 9);
  glEl.style.filter = blur > .2 ? `blur(${blur.toFixed(1)}px)` : 'none';
}
let curT = 0;
function seekTimeline(t) {
  curT = cl(t, 0, DURATION);
  tl.seek(curT, false);
  update(curT); applyCam(curT);
  renderer.render(scene, cam);
  if (DEBUG) { dr.value = curT; dt.textContent = curT.toFixed(2) + ' / ' + DURATION.toFixed(2) + ' · ' + (SCENES.find(s => curT >= s.t0 && curT < s.t1) || SCENES.at(-1)).id; }
}
window.seekTo = sec => seekTimeline(sec);

/* ============ SFX (dicampur render.mjs) ============ */
const SFX = [
  { t: .15, file: 'sfx_whoosh.wav', vol: .15 }, { t: HIT, file: 'sfx_pop.wav', vol: .16 },
  { t: T(2) + 2.0, file: 'sfx_glitch.wav', vol: .14 }, { t: T(3) + .05, file: 'sfx_whoosh.wav', vol: .15 },
  ...SHOTS.map(s => ({ t: s.ts + .42, file: 'sfx_pop.wav', vol: s.side > 0 ? .15 : .14 })),
  { t: T(4) + 3.75, file: 'sfx_success.wav', vol: .16 }, { t: T(5) + .3, file: 'sfx_whoosh.wav', vol: .15 },
  { t: T(5) + 4.15, file: 'sfx_pop.wav', vol: .15 }, { t: T(6) + .05, file: 'sfx_whoosh.wav', vol: .15 },
  { t: T(6) + 1.7, file: 'sfx_whoosh.wav', vol: .14 },
  ...[0, 2, 4, 6].map(i => ({ t: T(6) + 2.55 + i * .2, file: 'sfx_click.wav', vol: .14 })),
  { t: T(7) + .05, file: 'sfx_whoosh.wav', vol: .14 }, { t: T(7) + 2.85, file: 'sfx_pop.wav', vol: .15 },
  { t: T(8) + .05, file: 'sfx_whoosh.wav', vol: .14 }, ...[1, 2, 3, 4, 5].map(i => ({ t: T(8) + .2 + i * .32, file: 'sfx_click.wav', vol: .14 })),
  { t: T(9) + .1, file: 'sfx_whoosh.wav', vol: .15 }, { t: T(9) + 2.65, file: 'sfx_pop.wav', vol: .15 },
  { t: T(10) + .1, file: 'sfx_whoosh.wav', vol: .15 }, { t: T(10) + 3.0, file: 'sfx_glitch.wav', vol: .15 },
  { t: T(11) + .2, file: 'sfx_whoosh.wav', vol: .14 }, { t: T(11) + 1.5, file: 'sfx_pop.wav', vol: .15 },
];

/* ============ tampilan & preview ============ */
function fit() { const s = RENDER ? 1 : Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${s})`; stage.style.left = RENDER ? '0' : ((innerWidth - W * s) / 2) + 'px'; }
addEventListener('resize', fit); fit();
const dr = document.getElementById('dbg-r'), dt = document.getElementById('dbg-t');
if (DEBUG) { document.body.classList.add('debug'); dr.max = DURATION; dr.oninput = e => { playing = false; seekTimeline(+e.target.value); }; }
let playing = !RENDER && Q.get('t') === null, wall = 0, from = 0;
const vo = new Audio('vo.mp3'); vo.preload = 'auto';
function loop(now) {
  if (!playing) return;
  let t = from + (now - wall) / 1000;
  if (t >= DURATION + .8) { from = 0; wall = now; t = 0; try { vo.currentTime = 0; } catch (e) {} }
  seekTimeline(Math.min(t, DURATION));
  requestAnimationFrame(loop);
}
function play() { playing = true; wall = performance.now(); from = curT >= DURATION ? 0 : curT; try { vo.currentTime = from; vo.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }
function pause() { playing = false; try { vo.pause(); } catch (e) {} }
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'r' || e.key === 'R') { seekTimeline(0); pause(); play(); }
});
document.getElementById('dbg-play').onclick = () => playing ? pause() : play();

/* ============ start setelah font siap (tekstur kanvas butuh font) ============ */
window.OPENER = { ready: false, DURATION, FPS, WIDTH: W, HEIGHT: H, SCENES, SFX, seek: s => window.seekTo(s) };
seekTimeline(Number(Q.get('t')) || 0);
window.OPENER.ready = true;
if (playing) play();
})();
</script>
