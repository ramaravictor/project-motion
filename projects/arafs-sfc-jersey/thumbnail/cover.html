<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Cover Jersey SFC</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Manrope:wght@600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0E2A1D;font-family:Manrope,sans-serif}
.tex{position:absolute;inset:-100px;background:url(../assets/songket-motif.png) 0 0/245px 330px repeat;opacity:.13;filter:grayscale(1)}
.glow{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 100%,rgba(245,196,0,.22),transparent 70%)}
.sheet{position:absolute;left:36px;top:110px;width:1008px;height:1700px;border-radius:52px;background:#FBFAF6;box-shadow:0 40px 90px rgba(0,0,0,.45)}
.k{position:absolute;left:80px;top:200px;font:700 28px 'JetBrains Mono';letter-spacing:.06em;color:#8A6A12}
.t1{position:absolute;left:76px;top:250px;font:400 150px/1 'Permanent Marker';color:#141619}
.t2{position:absolute;left:76px;top:405px;font:400 150px/1 'Permanent Marker';color:#C8102E}
.stack{position:absolute;left:150px;top:620px;width:780px;height:780px}
.c{position:absolute;inset:0;border-radius:36px;overflow:hidden;box-shadow:0 24px 50px rgba(20,22,25,.3)}
.c img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.c.b2{transform:translate(-60px,30px) rotate(-8deg) scale(.94)}
.c.b1{transform:translate(-30px,14px) rotate(-4deg) scale(.97)}
.split{position:absolute;inset:0;clip-path:inset(0 0 0 50%)}
.split img{filter:grayscale(1) brightness(.85)}
.line{position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#FBFAF6}
.stamp{position:absolute;right:-30px;top:40px;font:800 46px Manrope;letter-spacing:.04em;color:#fff;background:#C8102E;padding:14px 26px;border-radius:14px;transform:rotate(8deg);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.pill{position:absolute;left:24px;bottom:24px;font:800 32px Manrope;color:#141619;background:#fff;padding:10px 22px;border-radius:99px}
.cap{position:absolute;left:80px;width:870px;top:1440px;text-align:center;font:800 54px/1.2 Manrope;color:#141619}
.cap b{color:#C8102E}
.cr{position:absolute;left:80px;width:870px;top:1610px;text-align:center;font:700 26px 'JetBrains Mono';color:#9A948A}
</style></head><body>
<div class="tex"></div><div class="glow"></div><div class="sheet"></div>
<div class="k">— SRIWIJAYA FC · KIT 2026/27</div>
<div class="t1">Jersey udah jadi,</div>
<div class="t2">klubnya nggak main</div>
<div class="stack">
  <div class="c b2"><img src="../assets/third.png"></div>
  <div class="c b1"><img src="../assets/away.png"></div>
  <div class="c"><img src="../assets/home.png"><div class="split"><img src="../assets/home.png" style="width:100%;height:100%;object-fit:cover;object-position:50% 40%"></div><div class="line"></div><div class="pill">· HOME KIT</div></div>
  <div class="stamp">BELUM DIPAKAI</div>
</div>
<div class="cap">3 jersey, motif songket,<br><b>0 pertandingan</b></div>
<div class="cr">foto &amp; desain: Arafs Apparel</div>
<script>document.fonts.ready.then(()=>{document.querySelectorAll('.t1,.t2').forEach(el=>{let f=150;while(el.scrollWidth>880&&f>60){f-=4;el.style.fontSize=f+'px';}});});</script>
</body></html>
