<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Cover Top 5</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#140c06;color:#fff;font-family:'Plus Jakarta Sans',sans-serif}
.bg{position:absolute;inset:-80px;background:url(frame-salto.png) center/cover;filter:blur(28px) saturate(1.3) brightness(.5)}
.sc{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,12,6,.3),rgba(20,12,6,.1) 30%,rgba(20,12,6,.85) 55%,rgba(20,12,6,.96))}
.top{position:absolute;left:80px;right:130px;top:200px;display:flex}
.badge{display:flex;font:800 30px 'JetBrains Mono';letter-spacing:.04em;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.badge b{background:#F5C400;color:#141619;padding:10px 18px}.badge span{background:#C8102E;padding:10px 18px}
.panel{position:absolute;left:80px;top:300px;width:870px;height:560px;border-radius:26px;overflow:hidden;border:6px solid #F5C400;box-shadow:0 30px 60px rgba(0,0,0,.55);transform:rotate(-1.5deg)}
.panel img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;filter:saturate(1.2) contrast(1.08)}
.num{position:absolute;right:150px;top:740px;font:400 260px/1 Anton,sans-serif;color:#F5C400;text-shadow:0 12px 40px rgba(0,0,0,.7);transform:rotate(6deg)}
.num i{font-style:normal;font-size:140px;color:#fff;vertical-align:top}
.txt{position:absolute;left:80px;right:130px;top:960px;display:flex;flex-direction:column;gap:28px}
.t{font-family:'Anton',sans-serif;line-height:1;text-transform:uppercase;text-shadow:0 8px 30px rgba(0,0,0,.6)}
.t .a{display:block;font-size:150px;white-space:nowrap}
.t .b{display:block;font-size:150px;white-space:nowrap;margin-top:10px}
.hl{background:#F5C400;color:#141619;padding:0 .12em;display:inline-block;transform:skewX(-6deg)}
.sub{font:700 44px/1.2 'Plus Jakarta Sans';color:#F3E7D0;border-left:8px solid #C8102E;padding-left:22px}
</style></head><body>
<div class="bg"></div><div class="sc"></div>
<div class="top"><div class="badge"><b>TOP 5</b><span>SRIWIJAYA FC</span></div></div>
<div class="panel"><img src="frame-salto.png"></div>
<div class="num"><i>#</i>1</div>
<div class="txt"><div class="t"><span class="a">Selebrasi</span><span class="b">paling <span class="hl">unik</span></span></div>
<div class="sub">Dari ofisial push-up sampai jungkir balik.<br>Nomor satu bikin geleng-geleng</div></div>
<script>document.fonts.ready.then(()=>{const W=document.querySelector('.t').clientWidth-20;document.querySelectorAll('.t .a,.t .b').forEach(el=>{el.style.display='inline-block';let f=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>W&&f>60){f-=2;el.style.fontSize=f+'px';}el.style.display='block';});});</script>
</body></html>
