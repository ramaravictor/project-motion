<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Opsi C Gembok Glossy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFE8;--ink:#141619;--orange:#FF5500;--border:#DFD8CE}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif}
#vp{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.bg-grid{position:absolute;inset:0;background-size:48px 48px;background-image:linear-gradient(to right,rgba(20,22,25,.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(20,22,25,.035) 1px,transparent 1px)}
#safe{position:absolute;top:180px;left:80px;width:870px;height:1290px;z-index:20}
.hdr{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:14px}.logo .yt{width:56px;height:42px;filter:drop-shadow(0 6px 14px rgba(255,0,0,.22))}
.logo .col{display:flex;flex-direction:column;line-height:1.08}.logo b{font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
.logo span{font:700 15px 'JetBrains Mono';color:var(--orange)}
.rg{display:flex;gap:10px;align-items:center}
.tag{font:800 14px 'JetBrains Mono';color:#fff;background:var(--orange);padding:8px 14px;border-radius:99px;white-space:nowrap}
.ig{font:700 17px 'JetBrains Mono';color:var(--ink);background:rgba(255,255,255,.9);border:1.5px solid var(--border);padding:7px 14px 7px 10px;border-radius:99px;display:flex;gap:8px;align-items:center}
.ig img{width:24px;height:24px}
#stage{position:absolute;top:90px;left:0;width:870px;height:520px}
#dock{position:absolute;top:626px;left:0;width:870px;height:220px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0 6px}
.h1{font-size:48px;font-weight:800;line-height:1.1;letter-spacing:-.035em;color:var(--ink)}.hl{color:var(--orange)}
.cap{background:rgba(255,255,255,.86);border:1.5px solid var(--border);padding:12px 20px;border-radius:16px;font-size:20px;font-weight:600;line-height:1.35;color:#374151;align-self:flex-start}
#chs{position:absolute;left:80px;width:870px;bottom:130px;height:740px;display:flex;justify-content:center;align-items:flex-end;z-index:10}
#rig{position:relative;width:740px;height:740px;-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent 100%)}
#rig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#rig .pose{filter:drop-shadow(0 20px 45px rgba(0,0,0,.14))}
.gs{position:absolute;bottom:20px;width:500px;height:44px;background:radial-gradient(ellipse at center,rgba(0,0,0,.18),transparent 70%)}
.gl{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:radial-gradient(60% 80% at 70% 45%,#ff7a2f 0%,#c2410c 28%,#3b0d1a 62%,#120814 100%)}
.gl .grain{position:absolute;inset:-40px;filter:url(#grain);opacity:.28;mix-blend-mode:overlay}
.lock{position:absolute;left:520px;top:150px;width:230px;height:200px;border-radius:44px;background:linear-gradient(160deg,#fff7ed 0%,#fdba74 30%,#ea580c 70%,#7c2d12 100%);box-shadow:inset 0 10px 24px rgba(255,255,255,.7),inset 0 -18px 30px rgba(0,0,0,.35),0 40px 70px rgba(0,0,0,.45)}
.lock::before{content:'';position:absolute;left:44px;top:-118px;width:142px;height:150px;border:30px solid #fde4cf;border-bottom:0;border-radius:90px 90px 0 0;box-shadow:inset 0 6px 10px rgba(255,255,255,.6)}
.lock::after{content:'';position:absolute;left:96px;top:70px;width:38px;height:62px;border-radius:20px;background:#3b0d1a}
.chip{position:absolute;left:40px;top:120px;width:400px;padding:22px 24px;border-radius:22px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);color:#fff;font:500 19px 'JetBrains Mono';line-height:1.6}
.chip .x{display:inline-block;margin-top:12px;background:#fff;color:#B91C1C;font:800 18px 'Sora';padding:8px 14px;border-radius:12px}
.brand{position:absolute;left:40px;top:36px;color:#fff;font:800 34px 'Sora';letter-spacing:-.02em}.brand span{font:500 18px 'Sora';opacity:.75;margin-left:10px}
.orb{position:absolute;left:600px;top:400px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#fed7aa 40%,rgba(255,122,47,0) 72%)}
</style></head><body><div id="vp"><div class="bg-grid"></div>
<div id="safe">
<header class="hdr"><div class="logo"><img class="yt" src="../../_shared/brand/logo-youtube.svg"><div class="col"><b>ChillDev</b><span>@chilldevibe</span></div></div>
<div class="rg"><div class="tag">GITLEAKS</div><div class="ig"><img src="../../_shared/brand/logo-instagram.svg"><span>@ramarvctr_</span></div></div></header>
<section id="stage"><svg width="0" height="0" style="position:absolute"><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></svg><div class="gl"><div class="grain"></div><div class="brand">gitleaks <span>30,8k ★ · MIT</span></div>
<div class="chip">$ git commit -m "ship"<br>scanning 12 files…<br><span class="x">✕ SECRET DETECTED · OPENAI_API_KEY</span></div>
<div class="lock"></div><div class="orb"></div></div></section>
<section id="dock"><h1 class="h1"><span class="hl">Gitleaks</span> nyegat key sebelum ke-push</h1><div class="cap">Pre-commit hook jadi satpam. Ada secret? Commit lo ditahan di gerbang.</div></section>
</div>
<section id="chs"><div class="gs"></div><div id="rig"><img class="pose" src="../../_shared/rama/rama_pose_point_up.png"><img src="../../_shared/rama/mouth_v3_med.png"></div></section>
</div></body></html>
