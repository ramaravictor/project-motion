<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Thumbnail · AI Ngeklik Sendiri</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFD23F; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFD23F; font-family: 'Unbounded', sans-serif; }
  .blob { position: absolute; border-radius: 50%; }

  .title { position: absolute; left: 80px; top: 190px; width: 870px; font: 800 116px/.98 'Unbounded'; letter-spacing: -.05em; color: #141619; }
  .title b { color: #FF5500; }

  /* jendela flat */
  .win { position: absolute; background: #fff; border: 6px solid #141619; border-radius: 26px; box-shadow: 12px 14px 0 #141619; overflow: hidden; }
  .win .bar { height: 50px; background: #7DD3FC; border-bottom: 6px solid #141619; display: flex; align-items: center; gap: 10px; padding: 0 18px; }
  .win .bar i { width: 16px; height: 16px; border-radius: 50%; border: 4px solid #141619; background: #fff; }
  .win .bar span { margin-left: 8px; font: 800 20px 'JetBrains Mono', monospace; color: #141619; }
  .tag { position: absolute; font: 800 24px 'JetBrains Mono', monospace; color: #fff; background: #141619; padding: 6px 12px; border-radius: 10px; white-space: nowrap; }
  .input { position: absolute; left: 30px; top: 104px; right: 30px; height: 72px; border: 5px solid #141619; border-radius: 18px; font: 800 26px 'JetBrains Mono', monospace; display: flex; align-items: center; padding: 0 20px; color: #141619; }
  .btn { position: absolute; border-radius: 40px; background: #141619; color: #FFD23F; font: 800 34px 'Unbounded'; display: flex; align-items: center; justify-content: center; }
  .hl { position: absolute; width: 34px; height: 34px; border: 0 solid #FF5500; }

  .bot { position: absolute; left: 330px; top: 1000px; width: 210px; height: 210px; }
  .cnt { position: absolute; left: 700px; top: 600px; background: #141619; color: #fff; font: 800 44px 'Unbounded'; padding: 14px 28px; border-radius: 999px; transform: rotate(8deg); white-space: nowrap; }
  .badge { position: absolute; left: 80px; top: 1250px; font: 800 38px 'JetBrains Mono', monospace; color: #fff; background: #141619; padding: 14px 26px; border-radius: 18px; white-space: nowrap; }

  .rama { position: absolute; left: 470px; top: 1290px; width: 560px; height: 560px;
    -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 100%); mask-image: linear-gradient(to bottom, #000 80%, transparent 100%); }
  .rama img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .rama .p { filter: drop-shadow(10px 16px 0 rgba(20,22,25,.18)); }
</style>
</head>
<body>
<div id="c">
  <div class="blob" style="width:620px;height:620px;right:-230px;top:-120px;background:#FF8FB1"></div>

    <div class="bar"><i></i><i></i><i></i><span>toko-a.id</span></div>
    <div class="input">laptop 14 inci|</div>

    <div class="hl" style="left:322px;top:94px;border-top-width:8px;border-right-width:8px"></div>
    <div class="hl" style="left:34px;top:182px;border-bottom-width:8px;border-left-width:8px"></div>

    <div class="tag" style="left:50px;top:220px">[3] klik</div>
  </div>

  <!-- robot + kursor -->
  <svg class="bot" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#fff" stroke="#141619" stroke-width="6"/><rect x="32" y="42" width="56" height="40" rx="14" fill="#A7F3D0" stroke="#141619" stroke-width="5"/><circle cx="49" cy="62" r="6" fill="#141619"/><circle cx="71" cy="62" r="6" fill="#141619"/><path d="M60 42 V26" stroke="#141619" stroke-width="5"/><circle cx="60" cy="21" r="6" fill="#FF5500" stroke="#141619" stroke-width="4"/></svg>
  <svg style="position:absolute;left:560px;top:930px;width:90px;height:110px" viewBox="0 0 30 36"><path d="M2 2 L2 30 L9 23 L14 34 L19 32 L14 21 L24 21 Z" fill="#141619" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>

  <div class="cnt">×50 ✓</div>
  <div class="badge">pakai browser-use</div>

  <div class="rama">
    <img class="p" src="../_shared/rama/rama_pose_thumbsup.png" alt="">
    <img src="../_shared/rama/mouth_v3_med.png" alt="">
  </div>
</div>
</body>
</html>
