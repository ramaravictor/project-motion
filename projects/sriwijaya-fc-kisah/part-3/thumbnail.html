<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Thumbnail Part 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=DotGothic16&family=IBM+Plex+Mono:wght@600&family=Playfair+Display:wght@900&family=Old+Standard+TT:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_world/stadium.css">
<script src="../_world/stadium.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#070b18;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
  #stamp{position:absolute;left:540px;top:600px;transform:translate(-50%,-50%) rotate(-9deg);font:400 66px/1.05 'Special Elite',monospace;color:#ff4a3a;border:7px solid #ff4a3a;padding:10px 26px;text-align:center;white-space:nowrap;letter-spacing:.05em;text-shadow:0 0 18px rgba(255,74,58,.55);box-shadow:0 0 30px rgba(255,74,58,.35),inset 0 0 18px rgba(255,74,58,.25)}
  #scrim{position:absolute;left:-200px;width:1100px;top:720px;height:560px;background:radial-gradient(60% 55% at 40% 50%,rgba(4,6,14,.9),rgba(4,6,14,0) 75%)}
  #kick{position:absolute;left:80px;top:770px;font:600 32px 'IBM Plex Mono',monospace;color:#f0c35a;letter-spacing:.2em}
  #title{position:absolute;left:74px;width:900px;top:830px;font:700 150px/.92 'Cormorant Garamond',serif;color:#efe8d6;letter-spacing:-.02em;text-shadow:0 6px 40px rgba(0,0,0,.8)}
  #title i{font-style:italic;color:#ff7a66}
  #sub{position:absolute;left:80px;width:600px;top:1145px;font:600 italic 50px/1.15 'Cormorant Garamond',serif;color:#e9e2cf;text-shadow:0 4px 24px rgba(0,0,0,.85)}
  #sub b{color:#f0c35a;font-weight:700}
  #part{position:absolute;left:80px;top:1300px;font:600 30px 'IBM Plex Mono',monospace;color:#070b18;background:#f5c400;padding:10px 26px;border-radius:6px;letter-spacing:.14em;white-space:nowrap}
  #feather{position:absolute;left:830px;top:1478px;width:120px;transform:rotate(14deg);filter:drop-shadow(0 0 14px rgba(255,231,166,.55))}
  #tag{position:absolute;left:0;right:0;top:1760px;text-align:center;font:600 30px 'IBM Plex Mono',monospace;color:#9aa6c4;letter-spacing:.12em}
  #grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  #vig{position:absolute;inset:0;background:radial-gradient(85% 60% at 50% 48%,transparent 50%,rgba(0,0,0,.65) 100%)}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="board">
      <div class="row">KEPUTUSAN PT LIB</div>
      <div class="row g">SRIWIJAYA FC</div>
      <div class="row">LIGA NUSANTARA 26/27</div>
    </div>
    <div id="stamp">TIDAK MEMENUHI<br>SYARAT</div>
  </div>
  <div id="scrim"></div>
  <div id="kick">LIGA NUSANTARA 26/27</div>
  <div id="title">Kalah di<br><i>meja administrasi</i></div>
  <div id="sub">Belum main satu laga pun, <b>sudah terlempar</b></div>
  <div id="part">PART 3 / 4</div>
  <svg id="feather" viewBox="0 0 120 40"><path d="M4 21 C30 3 82 1 116 17 C82 31 34 35 4 21 Z" fill="#efe6d2"/><path d="M2 21 L116 17" stroke="#9c8f74" stroke-width="2.4"/><path d="M40 12 L52 21 M62 9 L72 19 M84 10 L92 18 M44 30 L54 21 M66 30 L74 20" stroke="#cfc3a8" stroke-width="1.6"/></svg>
  <div id="tag">@ramarvctr_</div>
  <div id="grain"></div>
  <div id="vig"></div>
</div>
<script>
  const S = window.Stadium, ctx = document.getElementById('cv').getContext('2d');
  // kliping 2008 yang pudar di kursi kuning, di bawah lampu terakhir
  const clip = S.clipping({ mast: 'OLAHRAGA', date: 'MUSIM 2007/08', head: 'Double winner pertama di Indonesia', photo: 'trophy' });
  clip.style.cssText += ';left:0;top:0;visibility:visible;transform:translate(560px,1240px) rotate(-8deg) scale(.5);filter:grayscale(.85) sepia(.35) brightness(.9)';
  document.getElementById('world').appendChild(clip);
  window.seekTo = (t) => S.render(ctx, t, { lights: [0, 0, 0, 1], crowd: .02, cheer: 0, confetti: 0, confettiT: 0, players: { mode: 'walk', a: 0 } });
  window.seekTo(47);
</script>
</body>
</html>
