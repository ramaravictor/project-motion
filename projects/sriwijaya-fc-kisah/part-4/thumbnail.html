<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Thumbnail Part 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=DotGothic16&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_world/stadium.css">
<script src="../_world/stadium.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#070b18;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
  #board .row.b{color:#8fd0ff;text-shadow:0 0 14px rgba(120,190,255,.8)}
  #glow5{position:absolute;left:90px;top:-245px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(150,205,255,.55) 0%,rgba(150,205,255,.12) 30%,rgba(150,205,255,0) 62%);mix-blend-mode:screen;opacity:.85}
  #flare5{position:absolute;left:-260px;top:198px;width:1600px;height:14px;background:linear-gradient(90deg,rgba(170,220,255,0),rgba(200,232,255,.95) 50%,rgba(170,220,255,0));filter:blur(3px);mix-blend-mode:screen;opacity:.8}
  #scrim{position:absolute;left:0;right:0;top:720px;height:640px;background:radial-gradient(75% 55% at 50% 50%,rgba(4,6,14,.9),rgba(4,6,14,0) 75%)}
  #kick{position:absolute;left:0;right:0;top:770px;text-align:center;font:600 32px 'IBM Plex Mono',monospace;color:#8fd0ff;letter-spacing:.22em}
  #title{position:absolute;left:40px;right:40px;top:830px;text-align:center;font:700 158px/.92 'Cormorant Garamond',serif;color:#efe8d6;letter-spacing:-.02em;text-shadow:0 6px 40px rgba(0,0,0,.8)}
  #title i{font-style:italic;color:#8fd0ff;text-shadow:0 0 40px rgba(143,208,255,.45),0 6px 40px rgba(0,0,0,.8)}
  #sub{position:absolute;left:90px;right:90px;top:1150px;text-align:center;font:600 italic 52px/1.15 'Cormorant Garamond',serif;color:#e9e2cf;text-shadow:0 4px 24px rgba(0,0,0,.85)}
  #sub b{color:#f0c35a;font-weight:700}
  #part{position:absolute;left:50%;top:1320px;transform:translateX(-50%);font:600 30px 'IBM Plex Mono',monospace;color:#070b18;background:#f5c400;padding:10px 26px;border-radius:6px;letter-spacing:.14em;white-space:nowrap}
  #tag{position:absolute;left:0;right:0;top:1660px;text-align:center;font:600 30px 'IBM Plex Mono',monospace;color:#9aa6c4;letter-spacing:.12em}
  #grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  #vig{position:absolute;inset:0;background:radial-gradient(85% 60% at 50% 48%,transparent 50%,rgba(0,0,0,.65) 100%)}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="glow5"></div><div id="flare5"></div>
    <div id="board">
      <div class="row g">SRIWIJAYA FC</div>
      <div class="row">SEJAK 2004</div>
      <div class="row r">LAMPU: PADAM</div>
    </div>
  </div>
  <div id="scrim"></div>
  <div id="kick">JAKABARING · STADION YANG SAMA</div>
  <div id="title">Lampu di<br><i>tiang sebelah</i></div>
  <div id="sub">Klub baru menyala terang. <b>Kakaknya dibiarin gelap.</b></div>
  <div id="part">PART 4 / 4</div>
  <div id="tag">@ramarvctr_</div>
  <div id="grain"></div>
  <div id="vig"></div>
</div>
<script>
  const S = window.Stadium, ctx = document.getElementById('cv').getContext('2d');
  // lampu Sriwijaya padam semua, tiang kelima menyala biru
  window.seekTo = (t) => {
    S.render(ctx, t, { lights: [0, 0, 0, 0], crowd: .04, cheer: 0, confetti: 0, confettiT: 0, players: { mode: 'walk', a: 0 },
      extra: [{ x: 540, tx: 270, ty: 1400, lv: 1, col: [150, 205, 255], head: '#cfe6ff' }] });
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#18233f';
    ctx.fillRect(532, S.HEAD_Y + 26, 16, 1160 - S.HEAD_Y - 26); ctx.fillRect(514, S.HEAD_Y + 50, 52, 5);
  };
  window.seekTo(58);
</script>
</body>
</html>
