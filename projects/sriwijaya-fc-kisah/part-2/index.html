<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satu per Satu Padam · Part 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DotGothic16&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_world/stadium.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../_world/stadium.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;overflow:hidden;background:#070b18;transform-origin:50% 50%}
  body.render #stage{left:0;top:0;transform:none!important}
  #scrim{position:absolute;left:0;right:0;top:700px;height:520px;background:radial-gradient(70% 55% at 50% 50%,rgba(4,6,14,.75),rgba(4,6,14,0) 72%);pointer-events:none;opacity:0}
  #hud{position:absolute;inset:0;pointer-events:none}
  .say{position:absolute;left:70px;width:940px;top:790px;font:600 108px/1.02 'Cormorant Garamond',serif;color:#e9e2cf;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.6)}
  .say i{font-style:italic;color:#f0c35a}
  .say i.red{color:#ff7a66}
  .say .w{display:inline-block;white-space:nowrap;opacity:0}
  .lbl{position:absolute;left:74px;top:1060px;font:600 36px 'IBM Plex Mono',monospace;color:#b8c2dc;letter-spacing:.08em;white-space:nowrap;opacity:0}
  #tag{position:absolute;left:60px;right:60px;top:1640px;text-align:center;font:600 34px 'IBM Plex Mono',monospace;color:#9aa6c4;letter-spacing:.12em;opacity:0}
  #logo{position:absolute;left:390px;top:250px;width:300px;height:300px;object-fit:contain;opacity:0;filter:grayscale(.6) drop-shadow(0 0 30px rgba(245,196,0,.25))}
  #grain{position:absolute;inset:-60px;opacity:.09;mix-blend-mode:overlay;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(85% 60% at 50% 48%,transparent 50%,rgba(0,0,0,.6) 100%)}
  #dbg{position:fixed;left:10px;right:10px;bottom:10px;display:none;gap:10px;align-items:center;font:600 13px monospace;color:#ccc;z-index:99}
  #dbg input{flex:1}
  body.debug #dbg{display:flex}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="board"><div class="row"></div><div class="row"></div><div class="row"></div></div>
  </div>
  <div id="scrim"></div>
  <div id="hud"></div>
  <img id="logo" src="../_world/logo-sfc.png" alt="" onerror="this.remove()">
  <div id="tag">@ramarvctr_ · PART 2/4</div>
  <div id="grain"></div>
  <div id="vig"></div>
</div>
<div id="dbg"><button id="pp">▶</button><input id="scr" type="range" min="0" step="0.01"><span id="tt"></span></div>
<audio id="vo" src="vo.mp3" preload="auto"></audio>

<script>
(() => {
  const S = window.Stadium, Q = new URLSearchParams(location.search);
  const RENDER = Q.get('render') === '1', DEBUG = Q.get('debug') === '1';
  if (RENDER) document.body.classList.add('render');
  if (DEBUG) document.body.classList.add('debug');
  const $ = (q) => document.querySelector(q);

  /* Batas adegan = titik tengah jeda paragraf di vo.mp3 */
  const SCENES = [
    { id: 's01', t0: 0.00,  t1: 11.65, line: 'degradasi pertama 2018' },
    { id: 's02', t0: 11.65, t1: 21.64, line: 'musim depan kita naik lagi' },
    { id: 's03', t0: 21.64, t1: 32.29, line: 'denda FIFA Rp2,7 M' },
    { id: 's04', t0: 32.29, t1: 44.69, line: 'Rp4,1 miliar diwariskan' },
    { id: 's05', t0: 44.69, t1: 57.20, line: 'turun lagi ke kasta ketiga' },
  ];
  const DURATION = 57.2, FPS = 30;

  /* ---------- lampu: mulai menyala semua (lanjutan Part 1), padam satu per satu ---------- */
  const LIGHTS = [
    { i: 0, t: 10.35, type: 'off' },                     // degradasi 2018: cut di lampu mati
    { i: 1, t: 27.6, type: 'flick' },                    // sanksi FIFA: goyang
    { i: 1, t: 39.7, type: 'off' }, { i: 2, t: 40.6, type: 'off' },   // Rp4,1 M: dua padam berurutan (momen istimewa)
    { i: 3, t: 50.6, type: 'flick' },                    // lampu terakhir bertahan
  ];
  function worldState(t) {
    const crowd = t < 11.65 ? .85 : t < 21.64 ? S.lerp(.85, .42, S.EASE.io((t - 11.65) / 9)) : t < 32.29 ? .42 : t < 44.69 ? S.lerp(.42, .26, S.clamp((t - 32.29) / 8)) : S.lerp(.26, .14, S.clamp((t - 44.69) / 8));
    const pa = t < 21.64 ? 1 : t < 32.29 ? S.lerp(1, .55, S.clamp((t - 25) / 5)) : t < 44.69 ? .55 : S.lerp(.55, .25, S.clamp((t - 46) / 8));
    return { lights: [0, 1, 2, 3].map(i => S.light(LIGHTS, i, t, 1)), crowd, cheer: 0, confetti: 0, confettiT: 0, players: { mode: 'walk', a: pa } };
  }

  /* ---------- kamera ---------- */
  const WIDE = { s: 1, x: 540, y: 960 };
  const CAM0 = { s: 1.05, x: 540, y: 900 };
  const MOVES = [
    { t0: .4, t1: 2.8, to: { s: 1.4, x: 540, y: 560 } },            // papan skor: Asian Games
    { t0: 6.4, t1: 8.0, to: WIDE },
    { t0: 9.4, t1: 10.4, to: { s: 1.7, x: 200, y: 330 } },           // tilt ke lampu 1 yang akan mati
    { t0: 11.65, cut: true, to: { s: 1.3, x: 540, y: 1450 } },       // cut: tribun yang menipis
    { t0: 15.2, t1: 16.8, to: { s: 1.3, x: 540, y: 600 } },          // naik ke papan: tahun berganti
    { t0: 21.0, t1: 21.64, to: { s: 2.2, x: 540, y: 530 }, ease: 'in' },   // push-through ke papan
    { t0: 21.64, t1: 22.8, to: { s: 1.32, x: 540, y: 570 }, ease: 'out' },
    { t0: 27.0, t1: 28.4, to: { s: 1.55, x: 390, y: 330 } },          // lampu 2 goyang
    { t0: 29.6, t1: 31.0, to: WIDE },
    { t0: 32.29, cut: true, to: { s: 1.25, x: 540, y: 1520 } },      // cut: pemain berjalan menunduk
    { t0: 36.8, t1: 38.6, to: { s: 1.45, x: 540, y: 330 } },          // tilt ke lampu: dua akan padam
    { t0: 41.6, t1: 43.4, to: WIDE },
    { t0: 44.69, cut: true, to: { s: 1.35, x: 540, y: 560 } },       // cut ke papan: posisi 10
    { t0: 49.6, t1: 52.0, to: { s: 1.5, x: 950, y: 340 } },           // lampu terakhir
    { t0: 53.0, t1: 56.6, to: { s: 1.05, x: 540, y: 900 } },
  ];

  /* ---------- papan skor (baris boleh berupa fungsi waktu) ---------- */
  const YEARS = ['2019', '2020', '2021', '22/23', '23/24', '24/25'];
  const BOARD = [
    { t0: 0, rows: [['ASIAN GAMES 2018', .9, 'g'], ['LIGA 1 · POSISI 16', 5.0, ''], ['DEGRADASI · LIGA 2', 8.0, 'r']] },
    { t0: 11.65, rows: [['LIGA 2 · KASTA KEDUA', 12.2, ''], [(t) => 'MUSIM ' + YEARS[Math.min(5, Math.max(0, Math.floor((t - 16.6) / .75)))], 16.6, 'g'], [(t) => t < 20.2 ? 'NAIK? ...' : 'NAIK? ✕ TIDAK', 17.2, 'r']] },
    { t0: 21.64, rows: [['SANKSI FIFA', 22.0, 'r'], [(t) => 'DENDA ' + fifa(t), 23.4, ''], ['LARANGAN TRANSFER', 29.4, 'r']] },
    { t0: 32.29, rows: [['SENGKETA · RP1,3 M', 33.0, ''], ['GAJI NUNGGAK · APPI', 35.6, 'r'], [(t) => 'TOTAL ' + total(t), 38.4, 'r']] },
    { t0: 44.69, rows: [['CHAMPIONSHIP 25/26', 45.0, ''], ['POSISI 10 · DEGRADASI', 47.4, 'r'], ['LIGA NUSANTARA', 50.0, 'g']] },
  ];
  const ease = S.EASE.out;
  const fmtJt = (v) => v < 1000 ? 'RP' + Math.round(v) + ' JT' : 'RP' + (v / 1000).toFixed(1).replace('.', ',') + ' M';
  function fifa(t) { return fmtJt(S.lerp(810, 2700, ease(S.clamp((t - 25.2) / 2.2)))); }
  function total(t) { return 'RP' + S.lerp(1.3, 4.1, ease(S.clamp((t - 38.6) / 1.8))).toFixed(1).replace('.', ',') + ' M'; }
  const rowEls = [...document.querySelectorAll('#board .row')];
  function board(t) {
    let b = BOARD[0]; for (const x of BOARD) if (t >= x.t0) b = x;
    b.rows.forEach(([txt, at, cls], k) => {
      let s = '';
      if (t >= at) {
        if (typeof txt === 'function') s = txt(t);
        else { const n = Math.min(txt.length, Math.floor((t - at) * 26) + 1); s = txt.slice(0, n) + (n < txt.length && Math.floor(t * 6) % 2 ? '_' : ''); }
      }
      rowEls[k].textContent = s;
      rowEls[k].className = 'row' + (cls ? ' ' + cls : '');
    });
  }

  /* ---------- kalimat elegi ---------- */
  const hud = $('#hud');
  const tl = gsap.timeline({ paused: true });
  const SCRIM = [];
  function say(html, at, out, label) {
    const top = S.pickTop((t) => S.cam(t, CAM0, MOVES), at, out);
    const el = document.createElement('div'); el.className = 'say'; if (top) el.style.top = top + 'px';
    el.innerHTML = html.split(/(<i[^>]*>.*?<\/i>|\s+)/).filter(s => s && !/^\s+$/.test(s)).map(w => {
      const m = w.match(/^<i([^>]*)>(.*?)<\/i>$/);
      if (m) return m[2].split(' ').map(x => `<span class="w"><i${m[1]}>${x}</i></span>`).join(' ');
      return `<span class="w">${w}</span>`;
    }).join(' ');
    hud.appendChild(el);
    const ws = el.querySelectorAll('.w');
    tl.fromTo(ws, { opacity: 0, yPercent: 55, filter: 'blur(10px)' }, { opacity: 1, yPercent: 0, filter: 'blur(0px)', duration: .95, stagger: .1, ease: 'power4.out' }, at);
    tl.fromTo(ws, { opacity: 1, yPercent: 0, filter: 'blur(0px)' }, { opacity: 0, yPercent: -30, filter: 'blur(8px)', duration: .4, stagger: .03, ease: 'power2.in', immediateRender: false }, out);
    SCRIM.push([at - .2, out + .5, top || 790]);
    if (label) {
      const lb = document.createElement('div'); lb.className = 'lbl'; lb.textContent = label; if (top) lb.style.top = (top + 270) + 'px'; hud.appendChild(lb);
      tl.fromTo(lb, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: .7, ease: 'power3.out' }, at + .7);
      tl.fromTo(lb, { opacity: 1, x: 0 }, { opacity: 0, x: 0, duration: .3, ease: 'power2.in', immediateRender: false }, out);
    }
    return el;
  }
  say('Degradasi, untuk <i>pertama kalinya</i>', 7.2, 11.2, 'LIGA 1 2018 · PERINGKAT 16');
  say('Musim depan <i>kita naik</i> lagi', 13.0, 21.1, 'DIUCAPKAN TIAP TAHUN');
  const lineFifa = say('Denda FIFA jadi <i class="red">RP2,7&nbsp;M</i>', 24.6, 31.8, 'DARI RP810 JUTA');
  const lineTotal = say('<i class="red">Rp4,1&nbsp;miliar</i> diwariskan', 38.4, 44.2, 'NGGAK PERNAH DISELESAIKAN');
  say('Turun lagi, ke <i>kasta ketiga</i>', 47.6, 53.4, 'CHAMPIONSHIP 25/26 · PERINGKAT 10');
  tl.fromTo('#tag', { opacity: 0 }, { opacity: 1, duration: .8 }, 54.6);
  tl.set({}, {}, DURATION);
  const fifaW = lineFifa.querySelector('i'), totalW = lineTotal.querySelector('i');

  /* ---------- seek ---------- */
  const cv = $('#cv'), ctx = cv.getContext('2d', { willReadFrequently: true }), world = $('#world'), grain = $('#grain');
  function seek(t) {
    const T = Math.max(0, Math.min(DURATION, t));
    tl.pause(T, false);
    S.render(ctx, T, worldState(T));
    S.applyCam(world, T, S.cam(T, CAM0, MOVES));
    board(T);
    fifaW.textContent = fmtJt(S.lerp(810, 2700, ease(S.clamp((T - 25.2) / 2.2)))).replace('RP', 'Rp');
    totalW.textContent = 'Rp' + S.lerp(1.3, 4.1, ease(S.clamp((T - 38.6) / 1.8))).toFixed(1).replace('.', ',') + ' miliar';
    let sc = 0, stop = 790; for (const [a, b, tp] of SCRIM) { const v = S.clamp((T - a) / .6) * S.clamp((b - T) / .5); if (v > sc) { sc = v; stop = tp; } }
    $('#scrim').style.opacity = sc.toFixed(3); $('#scrim').style.top = (stop - 90) + 'px';
    const lg = $('#logo'); if (lg) { const on = S.clamp((T - 52.2) / 1.4) * .55; lg.style.opacity = on.toFixed(3); }
    const gk = Math.floor(T * 12);
    grain.style.transform = `translate(${((gk * 37) % 60) - 30}px,${((gk * 53) % 60) - 30}px)`;
    if (DEBUG) { $('#scr').value = T; $('#tt').textContent = T.toFixed(2) + ' s'; }
    return T;
  }
  window.seekTo = seek;

  const SFX = [
    { t: .4, file: 'sfx_whoosh.wav', vol: .14 },
    { t: 8.0, file: 'sfx_glitch.wav', vol: .15 },                                     // DEGRADASI di papan
    { t: 10.35, file: 'sfx_glitch.wav', vol: .14 }, { t: 11.2, file: 'sfx_click.wav', vol: .16 },   // lampu 1 mati
    { t: 11.65, file: 'sfx_whoosh.wav', vol: .14 },
    { t: 20.2, file: 'sfx_glitch.wav', vol: .14 },                                    // NAIK? ✕
    { t: 21.0, file: 'sfx_whoosh.wav', vol: .15 },                                    // push-through papan
    { t: 27.4, file: 'sfx_pop.wav', vol: .14 },                                       // denda selesai menghitung
    { t: 27.6, file: 'sfx_glitch.wav', vol: .14 },                                    // lampu 2 goyang
    { t: 32.29, file: 'sfx_whoosh.wav', vol: .14 },
    { t: 39.7, file: 'sfx_glitch.wav', vol: .14 }, { t: 40.55, file: 'sfx_click.wav', vol: .16 },   // lampu 2 mati
    { t: 40.6, file: 'sfx_glitch.wav', vol: .14 }, { t: 41.45, file: 'sfx_click.wav', vol: .16 },   // lampu 3 mati
    { t: 44.69, file: 'sfx_whoosh.wav', vol: .14 },
    { t: 47.4, file: 'sfx_glitch.wav', vol: .14 },                                    // POSISI 10 · DEGRADASI
    { t: 50.6, file: 'sfx_glitch.wav', vol: .14 },                                    // lampu terakhir goyang
  ];
  window.OPENER = { ready: true, DURATION, FPS, WIDTH: 1080, HEIGHT: 1920, SCENES, SFX, seek };

  /* ---------- tampilan & pemutaran ---------- */
  const stage = $('#stage');
  function fit() { if (RENDER) return; const s = Math.min(innerWidth / 1080, (innerHeight - (DEBUG ? 50 : 0)) / 1920); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); fit();
  seek(Number(Q.get('t')) || 0);
  if (RENDER || Q.get('clean') === '1') return;

  const vo = $('#vo'); let playing = false, w0 = 0, p0 = 0;
  vo.addEventListener('error', () => {});
  function loop(now) {
    if (!playing) return;
    let t = p0 + (now - w0) / 1000;
    if (t >= DURATION) { p0 = 0; w0 = now; t = 0; try { vo.currentTime = 0; } catch (e) {} }
    seek(t);
    if (vo.readyState >= 2 && t < vo.duration && Math.abs(vo.currentTime - t) > .15) vo.currentTime = t;
    requestAnimationFrame(loop);
  }
  function play() { playing = true; w0 = performance.now(); p0 = +($('#scr').value || 0); if (p0 >= DURATION - .05) p0 = 0; vo.currentTime = p0; vo.play().catch(() => {}); requestAnimationFrame(loop); $('#pp').textContent = '❚❚'; }
  function pause() { playing = false; vo.pause(); $('#pp').textContent = '▶'; }
  $('#scr').max = DURATION;
  $('#scr').oninput = (e) => { pause(); seek(+e.target.value); };
  $('#pp').onclick = () => playing ? pause() : play();
  addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); } if (e.key === 'r') { $('#scr').value = 0; pause(); play(); } });
  document.fonts.ready.then(() => {
    if (DEBUG) return;
    vo.play().then(() => { vo.pause(); play(); }).catch(() => { addEventListener('pointerdown', play, { once: true }); addEventListener('keydown', play, { once: true }); });
  });
})();
</script>
</body>
</html>
