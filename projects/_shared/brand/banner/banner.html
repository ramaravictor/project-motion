<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ChillDev Banner</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #141619; }
  svg { display: block; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 800; }
  .sans { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
  .sans5 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; }
  #guides { display: none; }
  body.g #guides { display: block; }
</style>
</head>
<body>
<svg id="art" width="2560" height="1440" viewBox="0 0 2560 1440"></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const OR = '#FF5500', INK = '#141619', CR = '#F4EFE8', BALL = '#FFF8EE';

// bola sepak sama dengan crest: pentagon tengah + 5 tepi + jahitan
function ball(cx, cy, R, id) {
  const k = R / 118;
  const pent = (x, y, r, rot) => Array.from({ length: 5 }, (_, i) => {
    const a = rot + i * 2 * Math.PI / 5; return (x + r * Math.cos(a)).toFixed(1) + ',' + (y + r * Math.sin(a)).toFixed(1);
  }).join(' ');
  let s = `<clipPath id="bc${id}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
    <g class="ball"><circle cx="${cx}" cy="${cy}" r="${R}" fill="${BALL}" stroke="${INK}" stroke-width="${8 * k}"/>
    <g clip-path="url(#bc${id})" fill="${INK}" stroke="${INK}" stroke-width="${7 * k}" stroke-linejoin="round">
    <polygon points="${pent(cx, cy, 40 * k, -Math.PI / 2)}"/>`;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 5, b = a + Math.PI / 5;
    s += `<polygon points="${pent(cx + 112 * k * Math.cos(a), cy + 112 * k * Math.sin(a), 36 * k, a + Math.PI)}"/>`;
    s += `<line x1="${cx + 40 * k * Math.cos(a)}" y1="${cy + 40 * k * Math.sin(a)}" x2="${cx + 76 * k * Math.cos(a)}" y2="${cy + 76 * k * Math.sin(a)}"/>`;
    s += `<line x1="${cx + 62 * k * Math.cos(b)}" y1="${cy + 62 * k * Math.sin(b)}" x2="${cx + 125 * k * Math.cos(b)}" y2="${cy + 125 * k * Math.sin(b)}"/>`;
  }
  return s + '</g></g>';
}

let grid = `<g stroke="#fff" stroke-width="2" opacity="0.04">`;
for (let x = 8; x < 2560; x += 48) grid += `<line x1="${x}" y1="0" x2="${x}" y2="1440"/>`;
for (let y = 8; y < 1440; y += 48) grid += `<line x1="0" y1="${y}" x2="2560" y2="${y}"/>`;
grid += '</g>';

// crest DEV UNITED (sama persis dengan crest 5), koordinat asli 800×800
const P = 'M400 110 L640 210 L640 450 Q640 610 400 700 Q160 610 160 450 L160 210 Z';
const crest = `
  <defs><clipPath id="sh5"><path d="${P}"/></clipPath></defs>
  <path d="${P}" fill="${CR}"/>
  <g clip-path="url(#sh5)">
    <path d="M120 300 L680 690" stroke="${OR}" stroke-width="80"/>
    <path d="M680 300 L120 690" stroke="${OR}" stroke-width="80"/>
  </g>
  <path d="${P}" fill="none" stroke="${OR}" stroke-width="16" stroke-linejoin="round"/>
  <text class="sans" x="400" y="290" font-size="104" letter-spacing="4" fill="${INK}" text-anchor="middle">DEV</text>
  <circle cx="400" cy="455" r="96" fill="${CR}"/>${ball(400, 455, 80, 'c')}
  <text class="sans" x="400" y="612" font-size="54" letter-spacing="8" fill="${INK}" text-anchor="middle" stroke="${CR}" stroke-width="10" paint-order="stroke">UNITED</text>`;

// area aman YouTube: 1546×423 di tengah → x 507–2053, y 508–931
document.getElementById('art').innerHTML = `
  <rect width="2560" height="1440" fill="${INK}"/>
  ${grid}
  <!-- dekorasi di luar area aman (terlihat di TV/desktop lebar) -->
  <g id="deco">
    <g opacity="0.07">${ball(250, 720, 430, 'big')}</g>
    <path d="M1900 -100 L2700 1540" stroke="${OR}" stroke-width="150"/>
    <path d="M2700 -100 L1900 1540" stroke="${OR}" stroke-width="150"/>
  </g>
  <g id="crest" transform="translate(454 447) scale(0.66)">${crest}</g>
  <g id="copy">
    <text class="mono line" x="950" y="625" font-size="34" letter-spacing="8" fill="${OR}">DEVELOPER FOOTBALL CLUB</text>
    <text class="sans line" x="944" y="785" font-size="176" letter-spacing="-5" fill="${CR}">ChillDev</text>
    <text class="sans5 line" x="950" y="878" font-size="46" fill="${CR}" opacity="0.75">Ngoding · Ngopi · Ngebola</text>
    <g class="line">
      <rect x="1600" y="828" width="330" height="70" rx="35" fill="${OR}"/>
      <text class="mono" x="1765" y="875" font-size="34" fill="#fff" text-anchor="middle">@chilldevibe</text>
    </g>
  </g>
  <g id="guides" fill="none" stroke-width="4" stroke-dasharray="16 12">
    <rect x="507" y="508.5" width="1546" height="423" stroke="#3CF"/>
    <rect x="0" y="508.5" width="2560" height="423" stroke="#FC3"/>
  </g>`;

const tl = gsap.timeline({ paused: true });
tl.from('#crest', { scale: 0.3, opacity: 0, svgOrigin: '718 715', duration: 0.7, ease: 'back.out(1.7)' }, 0)
  .from('.ball', { rotation: -360, transformOrigin: '50% 50%', duration: 1.2, ease: 'power3.out' }, 0.1)
  .from('.line', { x: -80, opacity: 0, duration: 0.6, stagger: 0.12, ease: 'power3.out' }, 0.35)
  .from('#deco', { opacity: 0, duration: 0.8 }, 0);
window.DURATION = tl.duration();
window.seekTo = s => tl.seek(Math.min(s, tl.duration()), false);
const q = new URLSearchParams(location.search);
if (q.has('guide')) document.body.classList.add('g');
if (q.has('still')) window.seekTo(tl.duration()); else tl.play();
addEventListener('keydown', e => { if (e.key === 'g' || e.key === 'G') document.body.classList.toggle('g'); if (e.key === ' ') tl.restart(); });
</script>
</body>
</html>
