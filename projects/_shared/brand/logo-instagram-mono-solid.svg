<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Instagram satu warna, kotak penuh dengan ikon berlubang (transparan). Warna mengikuti `color`. -->
  <defs>
    <mask id="igCut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="11" y="11" width="42" height="42" rx="11" fill="none" stroke="#000" stroke-width="4.5"/>
      <circle cx="32" cy="32" r="10" fill="none" stroke="#000" stroke-width="4.5"/>
      <circle cx="44.5" cy="19.5" r="3" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="16" fill="currentColor" mask="url(#igCut)"/>
</svg>
