<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>ChillDev Crest Options</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 800px; overflow: hidden; background: #141619; }
  svg { display: block; }
  .mono { font-family: 'JetBrains Mono', monospace; font-weight: 800; }
  .sans { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
</style>
</head>
<body>
<svg id="art" width="800" height="800" viewBox="0 0 800 800"></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const OR = '#FF5500', INK = '#141619', CR = '#F4EFE8', BALL = '#FFF8EE', BROWN = '#4A2716';
const svg = document.getElementById('art');

// bola sepak: pentagon tengah + 5 tepi + jahitan; skala dari radius R
function ball(cx, cy, R, id, mid = INK) {
  const k = R / 118;
  const pent = (x, y, r, rot) => Array.from({ length: 5 }, (_, i) => {
    const a = rot + i * 2 * Math.PI / 5; return (x + r * Math.cos(a)).toFixed(1) + ',' + (y + r * Math.sin(a)).toFixed(1);
  }).join(' ');
  let s = `<clipPath id="bc${id}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
    <g class="ball"><circle cx="${cx}" cy="${cy}" r="${R}" fill="${BALL}" stroke="${INK}" stroke-width="${8 * k}"/>
    <g clip-path="url(#bc${id})" fill="${INK}" stroke="${INK}" stroke-width="${7 * k}" stroke-linejoin="round">
    <polygon points="${pent(cx, cy, 40 * k, -Math.PI / 2)}" fill="${mid}"/>`;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 5, b = a + Math.PI / 5;
    s += `<polygon points="${pent(cx + 112 * k * Math.cos(a), cy + 112 * k * Math.sin(a), 36 * k, a + Math.PI)}"/>`;
    s += `<line x1="${cx + 40 * k * Math.cos(a)}" y1="${cy + 40 * k * Math.sin(a)}" x2="${cx + 76 * k * Math.cos(a)}" y2="${cy + 76 * k * Math.sin(a)}"/>`;
    s += `<line x1="${cx + 62 * k * Math.cos(b)}" y1="${cy + 62 * k * Math.sin(b)}" x2="${cx + 125 * k * Math.cos(b)}" y2="${cy + 125 * k * Math.sin(b)}"/>`;
  }
  return s + '</g></g>';
}
function grid(color, op) {
  let s = `<g stroke="${color}" stroke-width="2" opacity="${op}">`;
  for (let i = 8; i < 800; i += 48) s += `<line x1="${i}" y1="0" x2="${i}" y2="800"/><line x1="0" y1="${i}" x2="800" y2="${i}"/>`;
  return s + '</g>';
}
const SHIELD = 'M400 120 L620 185 L610 430 Q595 590 400 690 Q205 590 190 430 L180 185 Z';

const V = {
  // 1 — DEV FC: perisai klasik bergaris vertikal, { bola }
  1: () => {
    let stripes = '';
    for (let x = 180; x < 640; x += 92) stripes += `<rect x="${x}" y="100" width="46" height="620" fill="${OR}"/>`;
    return `<rect width="800" height="800" fill="${INK}"/>${grid('#fff', 0.04)}
    <defs><clipPath id="sh"><path d="${SHIELD}"/></clipPath></defs>
    <g id="main">
      <path d="${SHIELD}" fill="${CR}"/>
      <g clip-path="url(#sh)">${stripes}<rect x="150" y="100" width="500" height="200" fill="${INK}"/></g>
      <path d="${SHIELD}" fill="none" stroke="${CR}" stroke-width="14" stroke-linejoin="round"/>
      <text class="sans acc" x="400" y="275" font-size="104" letter-spacing="2" fill="${CR}" text-anchor="middle">DEV FC</text>
      <g class="acc"><circle cx="400" cy="480" r="118" fill="${INK}"/>${ball(400, 480, 100, '1')}</g>
      <text class="mono acc" x="252" y="525" font-size="130" fill="${INK}" text-anchor="middle" stroke="${CR}" stroke-width="8" paint-order="stroke">{</text>
      <text class="mono acc" x="548" y="525" font-size="130" fill="${INK}" text-anchor="middle" stroke="${CR}" stroke-width="8" paint-order="stroke">}</text>
    </g>`;
  },

  // 2 — ChillDev Football Club: roundel bertulisan melingkar
  2: () => `<rect width="800" height="800" fill="${OR}"/>${grid(INK, 0.07)}
    <defs>
      <path id="arcTop" d="M138,400 A262,262 0 0,1 662,400"/>
      <path id="arcBot" d="M108,400 A292,292 0 0,0 692,400"/>
    </defs>
    <g id="main">
      <circle cx="400" cy="400" r="335" fill="${INK}"/>
      <circle cx="400" cy="400" r="318" fill="none" stroke="${CR}" stroke-width="5"/>
      <circle cx="400" cy="400" r="222" fill="${CR}" stroke="${OR}" stroke-width="10"/>
      <text class="sans acc" font-size="46" letter-spacing="5" fill="${CR}"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">CHILLDEV FOOTBALL CLUB</textPath></text>
      <text class="mono acc" font-size="36" letter-spacing="6" fill="${OR}"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">EST · 2026</textPath></text>
      <circle cx="108" cy="400" r="9" fill="${OR}"/><circle cx="692" cy="400" r="9" fill="${OR}"/>
      <g class="acc">${ball(400, 400, 118, '2')}</g>
      <text class="mono acc" x="240" y="448" font-size="130" fill="${OR}" text-anchor="middle">{</text>
      <text class="mono acc" x="560" y="448" font-size="130" fill="${OR}" text-anchor="middle">}</text>
    </g>`,

  // 3 — NGOPI FC: perisai oranye, kopi tampak atas dengan bola, pita motto
  3: () => `<rect width="800" height="800" fill="${CR}"/>${grid(INK, 0.06)}
    <g id="main">
      <path d="${SHIELD}" fill="${OR}" stroke="${INK}" stroke-width="14" stroke-linejoin="round"/>
      <text class="sans acc" x="400" y="262" font-size="78" fill="${INK}" text-anchor="middle">NGOPI FC</text>
      <g class="acc">
        <ellipse cx="545" cy="440" rx="40" ry="22" fill="none" stroke="${INK}" stroke-width="14"/>
        <circle cx="400" cy="440" r="128" fill="${CR}" stroke="${INK}" stroke-width="10"/>
        <circle cx="400" cy="440" r="102" fill="${BROWN}"/>
        ${ball(400, 440, 72, '3')}
      </g>
      <g class="acc">
        <path d="M150 585 L200 585 L200 655 L150 655 L172 620 Z M650 585 L600 585 L600 655 L650 655 L628 620 Z" fill="${INK}"/>
        <rect x="190" y="575" width="420" height="70" rx="6" fill="${INK}"/>
        <text class="mono" x="400" y="621" font-size="24" letter-spacing="1" fill="${CR}" text-anchor="middle">NGOPI·NGODING·NGEBOLA</text>
      </g>
    </g>`,

  // 4 — 404 FC: angka nol diganti bola
  4: () => `<rect width="800" height="800" fill="${OR}"/>${grid(INK, 0.07)}
    <g id="main">
      <circle cx="400" cy="400" r="320" fill="${INK}"/>
      <circle cx="400" cy="400" r="300" fill="none" stroke="${CR}" stroke-width="5" stroke-dasharray="4 14" stroke-linecap="round"/>
      <text class="mono acc" x="400" y="232" font-size="30" letter-spacing="6" fill="${CR}" text-anchor="middle">TIM NOT FOUND</text>
      <text class="sans acc" x="235" y="505" font-size="250" fill="${CR}" text-anchor="middle">4</text>
      <g class="acc">${ball(400, 420, 92, '4')}</g>
      <text class="sans acc" x="565" y="505" font-size="250" fill="${CR}" text-anchor="middle">4</text>
      <text class="sans acc" x="400" y="625" font-size="96" letter-spacing="10" fill="${OR}" text-anchor="middle">FC</text>
    </g>`,

  // 5 — DEV UNITED: perisai krem dengan selempang silang oranye
  5: () => {
    const P = 'M400 110 L640 210 L640 450 Q640 610 400 700 Q160 610 160 450 L160 210 Z';
    return `<rect width="800" height="800" fill="${INK}"/>${grid('#fff', 0.04)}
    <defs><clipPath id="sh5"><path d="${P}"/></clipPath></defs>
    <g id="main">
      <path d="${P}" fill="${CR}"/>
      <g clip-path="url(#sh5)" class="acc">
        <path d="M120 300 L680 690" stroke="${OR}" stroke-width="80"/>
        <path d="M680 300 L120 690" stroke="${OR}" stroke-width="80"/>
      </g>
      <path d="${P}" fill="none" stroke="${OR}" stroke-width="16" stroke-linejoin="round"/>
      <text class="sans acc" x="400" y="290" font-size="104" letter-spacing="4" fill="${INK}" text-anchor="middle">DEV</text>
      <g class="acc"><circle cx="400" cy="455" r="96" fill="${CR}"/>${ball(400, 455, 80, '5')}</g>
      <text class="sans acc" x="400" y="612" font-size="54" letter-spacing="8" fill="${INK}" text-anchor="middle" stroke="${CR}" stroke-width="10" paint-order="stroke">UNITED</text>
    </g>`;
  },

  // 6 — DEV FC Modern: lencana minimal ala rebrand klub modern
  6: () => `<rect width="800" height="800" fill="${OR}"/>${grid(INK, 0.07)}
    <g id="main">
      <circle cx="400" cy="400" r="310" fill="${INK}"/>
      <circle cx="400" cy="400" r="282" fill="none" stroke="${OR}" stroke-width="8"/>
      <text class="sans acc" x="400" y="258" font-size="96" letter-spacing="12" fill="${CR}" text-anchor="middle">DEV</text>
      <g class="acc">${ball(400, 405, 105, '6', OR)}</g>
      <text class="sans acc" x="400" y="622" font-size="96" letter-spacing="12" fill="${CR}" text-anchor="middle">FC</text>
      <text class="mono acc" x="215" y="430" font-size="64" fill="${OR}" text-anchor="middle">&lt;</text>
      <text class="mono acc" x="585" y="430" font-size="64" fill="${OR}" text-anchor="middle">/&gt;</text>
    </g>`,
};

const v = new URLSearchParams(location.search).get('v') || '1';
svg.innerHTML = (V[v] || V[1])();

const tl = gsap.timeline({ paused: true });
tl.from('#main', { scale: 0.6, opacity: 0, svgOrigin: '400 400', duration: 0.6, ease: 'back.out(1.7)' }, 0)
  .from('.acc', { y: 40, opacity: 0, duration: 0.5, stagger: 0.1, ease: 'power3.out' }, 0.2)
  .from('.ball', { rotation: -360, transformOrigin: '50% 50%', duration: 1.2, ease: 'power3.out' }, 0.2);
window.DURATION = tl.duration();
window.seekTo = s => tl.seek(Math.min(s, tl.duration()), false);
if (new URLSearchParams(location.search).has('still')) window.seekTo(tl.duration()); else tl.play();
addEventListener('keydown', e => { if (e.key === ' ') tl.restart(); });
</script>
</body>
</html>
