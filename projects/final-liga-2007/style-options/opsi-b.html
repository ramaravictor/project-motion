<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Opsi B Siaran 2008</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Archivo+Black&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css">
<style>
.tv{position:absolute;inset:0;border-radius:40px;overflow:hidden;background:#0c1838;
  box-shadow:0 0 0 14px #2b2b2e,0 0 0 18px #1a1a1c,0 30px 60px -16px rgba(20,22,25,.55)}
.tv svg{position:absolute;inset:0;width:100%;height:100%}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);mix-blend-mode:multiply}
.vig{position:absolute;inset:0;background:radial-gradient(80% 75% at 50% 50%,transparent 55%,rgba(0,0,0,.6))}
.bug{position:absolute;left:26px;top:24px;display:flex;font:400 40px 'VT323';color:#fff;text-shadow:2px 0 rgba(255,60,60,.6),-2px 0 rgba(60,200,255,.6)}
.bug b{font:400 34px 'Archivo Black';padding:4px 14px;letter-spacing:.02em}
.bug .s{background:#F5C400;color:#111}.bug .p{background:#1E7B3C}.bug .n{background:#111;padding:4px 16px}.bug .t{background:#E8620C;padding:4px 14px}
.rec{position:absolute;right:28px;top:26px;font:400 38px 'VT323';color:#fff;text-shadow:2px 0 rgba(255,60,60,.6),-2px 0 rgba(60,200,255,.6)}
.rec i{display:inline-block;width:16px;height:16px;border-radius:50%;background:#ff3b30;margin-right:8px;box-shadow:0 0 12px #ff3b30}
.lower{position:absolute;left:0;bottom:44px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.lower .a{font:400 40px 'Archivo Black';color:#fff;background:#E8620C;padding:6px 26px 6px 30px;transform:skewX(-10deg);margin-left:-8px}
.lower .b{font:400 38px 'VT323';color:#0c1838;background:#eef2ff;padding:2px 30px;letter-spacing:.06em}
.glitch{position:absolute;left:0;right:0;top:250px;height:16px;background:rgba(160,200,255,.18);filter:blur(1px)}
</style></head><body><div id="viewport"><div class="bg-grid"></div>
