<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template v2 · ChillDev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Template v2 (AGENTS.md v2). Kerangka tetap: kanvas, safe zone, header ramping, Rama voxel, lip-sync, panel cek.
   Dunia visual (#world) dan teks scene (#copy) adalah PLACEHOLDER: ganti sesuai style brief Bang Motion.
   Dari folder part (projects/<seri>/part-1/), ubah semua "../_shared/" menjadi "../../_shared/". */
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:100%;height:100%;background:#05070D;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;transform-origin:0 0;background:#0B0E14}

/* ===== EDIT DI SINI: dunia / panggung visual (placeholder) ===== */
#world{position:absolute;inset:0;overflow:hidden}
#world .blob{position:absolute;border-radius:50%;filter:blur(40px)}
#world .b1{left:520px;top:180px;width:760px;height:760px;background:radial-gradient(circle,#2A4C9A 0%,rgba(42,76,154,0) 70%)}
#world .b2{left:-260px;top:900px;width:820px;height:820px;background:radial-gradient(circle,#7A2E12 0%,rgba(122,46,18,0) 70%)}
#world .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:48px 48px}
#copy .line{position:absolute;left:0;width:870px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;letter-spacing:-.035em;color:#fff}
#copy .line span{display:inline-block;margin-right:.24em}
#copy .note{position:absolute;left:0;top:76px;font:700 22px 'JetBrains Mono',monospace;color:#9CC2FF;opacity:.8}
/* ===== akhir bagian EDIT ===== */

/* safe zone: top 180, left 80, right 130, bottom 450 */
#safe{position:absolute;top:180px;left:80px;width:870px;height:1290px;z-index:3}
.hdr{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;z-index:5}
#topic-pill{font:800 24px 'JetBrains Mono',monospace;letter-spacing:.04em;color:#fff;background:#FF5500;padding:9px 16px;border-radius:10px;white-space:nowrap}
.handle{display:flex;align-items:center;gap:10px;font:700 22px 'JetBrains Mono',monospace;color:#fff;white-space:nowrap;padding:7px 14px 7px 8px;border-radius:99px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18)}
.handle img{width:28px;height:28px;display:block}
.handle b{font:800 22px 'Plus Jakarta Sans',sans-serif}

/* Rama voxel: kanvas 580px, diskalakan per scene */
#rama{position:absolute;left:0;top:0;width:580px;height:580px;transform-origin:0 0;z-index:4;pointer-events:none}
#rama-body{position:absolute;inset:0;transform-origin:50% 100%;filter:drop-shadow(0 26px 28px rgba(0,0,0,.5));
  -webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 100%);mask-image:linear-gradient(to bottom,#000 84%,transparent 100%)}
#rama canvas{display:block;width:580px;height:580px}

#guides{position:absolute;inset:0;pointer-events:none;display:none;z-index:20}
#stage.show-guides #guides{display:block}
#guides .safe{position:absolute;left:80px;top:180px;width:870px;height:1290px;outline:3px dashed #33CCFF}
#guides .bottom{position:absolute;left:0;right:0;top:1470px;bottom:0;background:rgba(255,60,60,.12)}
#guides .right{position:absolute;left:950px;right:0;top:0;bottom:0;background:rgba(255,60,60,.12)}

/* preview: kontrol & panel cek (disembunyikan saat ?render=1) */
#ctrl{position:absolute;left:0;bottom:0;height:48px;display:flex;gap:12px;align-items:center;padding:0 14px;background:#0F1218;color:#DDE3EE;font:600 13px 'JetBrains Mono',monospace;z-index:30}
#ctrl button{font:inherit;background:#FF5500;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
#ctrl input{width:360px}
#panel{position:absolute;right:0;top:0;bottom:0;width:440px;background:#0F1218;color:#DDE3EE;font:500 13px/1.4 'JetBrains Mono',monospace;overflow:auto;padding:16px;border-left:1px solid #222;z-index:30}
#panel h3{font-size:15px;margin-bottom:4px}
#summary{font-weight:700;margin-bottom:10px}
.chk{display:grid;grid-template-columns:20px 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid #1D2230}
.chk .dt{grid-column:2;color:#8A93A6;font-size:11px}
.chk.pass .ic{color:#34D399}.chk.fail .ic{color:#F87171}.chk.warn .ic{color:#FBBF24}
body.render #ctrl,body.render #panel{display:none}
</style>
</head>

    add(ph ? 'fail' : 'pass', 'Dunia & teks sudah didesain (placeholder dihapus)', ph ? `${ph} elemen data-placeholder masih ada (#world / #copy)` : 'tidak ada placeholder');
    const sections = stage.querySelectorAll('section, .scene, .slide').length;
    add(sections >= 3 ? 'warn' : 'pass', 'Bukan slide deck (larangan anti-PPT #1)', sections >= 3 ? `${sections} section/.scene: pastikan adegan berganti karena dunia/kamera, bukan fade section` : 'tidak ada section yang di-toggle');

    // tanpa CSS transition / keyframes
    const anim = [...stage.querySelectorAll('*')].filter(el => { const cs = getComputedStyle(el);
      return cs.transitionDuration.split(',').some(d => parseFloat(d) > 0) || (cs.animationName && cs.animationName !== 'none'); });
    add(anim.length ? 'fail' : 'pass', 'Tidak ada CSS transition / @keyframes', anim.length ? `${anim.length} elemen` : '0 elemen');

    // kode visual tanpa jam sistem
    const BAD = ['Math.ran' + 'dom', 'Date.n' + 'ow', 'performance.n' + 'ow'];
    const src = [...document.scripts].filter(s => !s.src && s.id !== 'preview-only').map(s => s.textContent).join('\n');
    const found = BAD.filter(b => src.includes(b));
    add(found.length ? 'fail' : 'pass', 'Tanpa jam sistem / acak di logika visual', found.join(', ') || 'bersih (loop preview dipisah)');

    // deterministik
    const snap = () => [ramaEl.style.transform, ramaBody.style.transform, hashStr(rv.canvas.toDataURL()),
      ...[...stage.querySelectorAll('#world *, #copy *, .hdr')].map(e => e.style.transform + e.style.opacity)].join('|');
    const probes = [0.5, ...SCENES.flatMap(s => [s.t0 + 0.12, s.t0 + 0.3, (s.t0 + s.t1) / 2])].filter(p => p <= DURATION);
    let mismatch = 0;
    probes.forEach(p => { seekTo(p); const a = snap(); seekTo(DURATION * 0.37); seekTo(0); seekTo(p); if (snap() !== a) mismatch++; });
    add(mismatch ? 'fail' : 'pass', 'seekTo() deterministik (dunia + Rama)', `${probes.length - mismatch}/${probes.length} titik identik setelah seek acak`);

    // pose & lip-sync
    const poses = [...new Set(RAMA.filter(r => !r.hidden).map(r => r.pose))];
    add(poses.length >= 2 ? 'pass' : 'warn', 'Pose Rama bervariasi', poses.join(', '));
    const vset = new Set();
    for (let f = 0; f < AUDIO_ENV.length; f++) vset.add(RamaVoxel.viseme(f, AUDIO_ENV[f] || 0, RAMA[sceneIdx(f / FPS)].pose));
    add(vset.size >= 5 ? 'pass' : 'warn', 'Lip-sync memakai ≥ 5 viseme', [...vset].sort().join(', ') || 'envelope kosong');
    add(AUDIO_ENV.length > 0 ? 'pass' : 'fail', 'Envelope audio ter-inline', `${AUDIO_ENV.length} frame (${(AUDIO_ENV.length / FPS).toFixed(1)} s)`);
    const envGap = AUDIO_ENV.length / FPS - DURATION;
    add(!AUDIO_ENV.length || Math.abs(envGap) < 3 ? 'pass' : 'warn', 'DURATION sesuai panjang VO', AUDIO_ENV.length ? `VO ${(AUDIO_ENV.length / FPS).toFixed(2)} s · DURATION ${DURATION} s` : 'belum ada VO');

    seekTo(keepT);
    const nP = out.filter(o => o.status === 'pass').length, nF = out.filter(o => o.status === 'fail').length, nW = out.filter(o => o.status === 'warn').length;
    const sum = $('#summary'); sum.textContent = `${nP} lolos · ${nF} gagal · ${nW} peringatan`; sum.style.color = nF ? '#F87171' : nW ? '#FBBF24' : '#34D399';
    $('#checks').innerHTML = out.map(o => `<div class="chk ${o.status}"><span class="ic">${o.status === 'pass' ? '✓' : o.status === 'fail' ? '✕' : '!'}</span><span>${o.title}</span><span class="dt">${o.detail}</span></div>`).join('');
    window.RULE_CHECKS = out;
    return out;
  };

  seekTo(Number(Q.get('t')) || 0);
})();
</script>
<script id="preview-only">
// Hanya untuk preview di browser (dilewati saat ?render=1): skala kanvas, putar VO, scrub, garis bantu, panel cek.
(() => {
  if (new URLSearchParams(location.search).has('render')) return;
  const stage = document.getElementById('stage'), D = window.OPENER.DURATION;
  const fit = () => { const k = Math.min((innerWidth - 440) / 1080, (innerHeight - 48) / 1920);
    stage.style.transform = `translate(${Math.max(0, (innerWidth - 440 - 1080 * k) / 2)}px,0) scale(${k})`; };
  fit(); addEventListener('resize', fit);
  const audio = new Audio('vo.mp3'), play = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  let playing = false, t0 = 0, base = 0;
  window.__onSeek = t => { scrub.value = Math.round(t / D * 1000); clock.textContent = t.toFixed(2) + ' s'; };
  play.onclick = () => { playing = !playing; play.textContent = playing ? '❚❚ Jeda' : '▶ Putar';
    if (playing) { base = +scrub.value / 1000 * D; t0 = performance.now(); audio.currentTime = base; audio.play().catch(() => {}); } else audio.pause(); };
  scrub.oninput = () => { const t = +scrub.value / 1000 * D; window.seekTo(t); base = t; t0 = performance.now(); if (playing) audio.currentTime = t; };
  addEventListener('keydown', e => { if (e.key === 'g' || e.key === 'G') stage.classList.toggle('show-guides'); if (e.key === ' ') { e.preventDefault(); play.click(); } });
  (function loop() { if (playing) { const t = audio.duration && !audio.paused ? audio.currentTime : base + (performance.now() - t0) / 1000;
      if (t >= D) { play.click(); window.seekTo(D); } else window.seekTo(t); } requestAnimationFrame(loop); })();
  document.fonts.ready.then(() => window.runChecks());
})();
</script>
