  #debug{position:absolute;left:0;right:0;bottom:0;padding:14px;background:rgba(0,0,0,.6);display:none;gap:12px;align-items:center;color:#fff;font:600 20px 'JetBrains Mono',monospace;z-index:99}

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q = new URLSearchParams(location.search);
const CLEAN = Q.has('clean'), DEBUG = Q.has('debug');
const W = 1080, H = 1920, DURATION = 44;

/* ---------- helpers (deterministik) ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const io3 = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const ioS = k => -(Math.cos(Math.PI * k) - 1) / 2;
const out3 = k => 1 - Math.pow(1 - k, 3);
const backOut = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const hash = i => { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const win = (t, a, b, f = .35) => clamp((t - a) / f) * (1 - clamp((t - (b - f)) / f)); // fade in/out window
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const col = h => new THREE.Color(h);

/* ---------- fit viewport ke jendela ---------- */
const vp = document.getElementById('viewport');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  vp.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ---------- renderer & scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const BG_DAY = col('#EFE7DB'), BG_NIGHT = col('#0A0F1C');
scene.background = BG_DAY.clone();
scene.fog = new THREE.Fog(BG_DAY.clone(), 22, 60);
const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xfff4e6, 0xcdbfa9, 1.3); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.position.set(-8, 16, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 50 });
sun.shadow.bias = -0.0004; sun.shadow.radius = 5;
scene.add(sun);
const alarm = new THREE.PointLight(0xff2a2a, 0, 22, 1.4); alarm.position.set(1.6, 4.2, -1.2); scene.add(alarm);
const screenGlow = new THREE.PointLight(0x5b8cff, 0, 9, 1.5); screenGlow.position.set(-1.2, 2.9, 5); scene.add(screenGlow);

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .62, metalness: .05, ...o });
const add = (geo, m, x, y, z, parent = scene) => { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; parent.add(me); return me; };
const rbox = (w, h, d, r = .06) => new RoundedBoxGeometry(w, h, d, 4, r);

/* lantai bergrid */
const gridCv = document.createElement('canvas'); gridCv.width = gridCv.height = 256;
{ const g = gridCv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256); g.strokeStyle = 'rgba(0,0,0,.10)'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256); }
const gridTex = new THREE.CanvasTexture(gridCv); gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping; gridTex.repeat.set(60, 60); gridTex.colorSpace = THREE.SRGBColorSpace;
const floorMat = mat('#E6DCCB', { map: gridTex, roughness: .95 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), floorMat);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

/* ---------- canvas texture helper ---------- */
function canvasTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return { c, g: c.getContext('2d'), tex, w, h };
}
const MONO = "'JetBrains Mono', monospace", SANS = "'Plus Jakarta Sans', sans-serif";
function rr(g, x, y, w, h, r, fill, stroke, lw = 2) { g.beginPath(); g.roundRect(x, y, w, h, r); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function txt(g, s, x, y, font, color, align = 'left', base = 'alphabetic') { g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }

/* ================= FRONTEND: meja + monitor ================= */
const desk = new THREE.Group(); desk.position.set(-1.2, 0, 4); scene.add(desk);
const wood = mat('#C99A6B', { roughness: .7 });
add(rbox(3.9, .12, 1.9, .04), wood, 0, 1.5, 0, desk);
for (const [x, z] of [[-1.8, -.8], [1.8, -.8], [-1.8, .8], [1.8, .8]]) add(new THREE.BoxGeometry(.1, 1.45, .1), mat('#2B2F3A'), x, .72, z, desk);
const monBody = mat('#20242E', { roughness: .4 });
add(rbox(.9, .05, .5, .02), monBody, 0, 1.58, -.4, desk);
add(rbox(.13, .75, .13, .03), monBody, 0, 1.95, -.45, desk);
add(rbox(3.28, 2.08, .14, .07), monBody, 0, 2.85, -.4, desk);
const SCR = canvasTex(1024, 632);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(3.06, 1.89), new THREE.MeshBasicMaterial({ map: SCR.tex, toneMapped: false }));
screen.position.set(0, 2.85, -.325); desk.add(screen);
add(rbox(1.7, .06, .55, .03), mat('#ECE7DF'), -.1, 1.59, .35, desk);
add(rbox(.32, .04, .5, .1), mat('#ECE7DF'), 1.15, 1.58, .35, desk);
const mug = add(new THREE.CylinderGeometry(.17, .15, .34, 24), mat('#E5561E'), 1.55, 1.73, -.1, desk);
add(new THREE.TorusGeometry(.09, .03, 8, 16), mat('#E5561E'), 1.74, 1.74, -.1, desk);
add(new THREE.CylinderGeometry(.22, .17, .4, 20), mat('#D9C7AE'), -1.6, 1.76, -.35, desk);
const leafMat = mat('#3E8E5E', { roughness: .8 });
const leaves = [];
for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; leaves.push(add(new THREE.SphereGeometry(.2, 12, 10), leafMat, -1.6 + Math.cos(a) * .17, 2.12 + (i % 2) * .16, -.35 + Math.sin(a) * .17, desk)); }
const M = V(-1.2, 2.85, 3.675); // pusat layar (dunia)

/* ================= BACKEND: rak server ================= */
const LEDS = Array.from({ length: 6 }, () => new THREE.MeshBasicMaterial({ color: 0x22c55e, toneMapped: false }));
const rackMat = mat('#2A303D', { roughness: .45, metalness: .2 }), unitMat = mat('#394254', { roughness: .4, metalness: .25 });
function makeRack(x, z, main) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  add(rbox(1.7, 3.6, 1.4, .08), rackMat, 0, 1.8, 0, g);
  for (let u = 0; u < 7; u++) {
    const y = .45 + u * .42;
    if (main && u === 6) continue;
    add(rbox(1.5, .34, .06, .02), unitMat, 0, y, .7, g);
    for (let k = 0; k < 5; k++) { const l = new THREE.Mesh(new THREE.BoxGeometry(.07, .07, .03), LEDS[(u * 5 + k + (main ? 0 : 3)) % 6]); l.position.set(-.6 + k * .12, y, .74); g.add(l); }
    add(new THREE.BoxGeometry(.5, .05, .02), mat('#1A1F29'), .42, y, .74, g);
  }
  return g;
}
const rack = makeRack(1.6, -2, true);
const RD = canvasTex(512, 160);
const rackScreen = new THREE.Mesh(new THREE.PlaneGeometry(1.42, .44), new THREE.MeshBasicMaterial({ map: RD.tex, toneMapped: false }));
rackScreen.position.set(0, 3.0, .735); rack.add(rackScreen);
const beacon = add(new THREE.CylinderGeometry(.16, .18, .26, 20), new THREE.MeshBasicMaterial({ color: 0x5a1a1a, toneMapped: false }), 0, 3.73, 0, rack);
const beamMat = new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const beam = new THREE.Mesh(new THREE.ConeGeometry(.9, 5, 24, 1, true), beamMat);
beam.geometry.translate(0, -2.5, 0); beam.rotation.z = Math.PI / 2;
const beamPivot = new THREE.Group(); beamPivot.position.set(0, 3.75, 0); beamPivot.add(beam); rack.add(beamPivot);

/* rak autoscale */
const extraRacks = [[3.7, -2.2], [5.8, -2.2], [3.7, -4.6], [5.8, -4.6], [7.9, -2.2], [7.9, -4.6]].map(([x, z]) => { const r = makeRack(x, z, false); r.scale.y = .001; r.visible = false; return r; });

/* ================= DATABASE ================= */
const db = new THREE.Group(); db.position.set(-1, 0, -8); scene.add(db);
const dbMat = mat('#1F9D7A', { roughness: .5 }), dbTop = mat('#2FBF95', { roughness: .5 });
const ringMats = [];
for (let i = 0; i < 3; i++) {
  const y = .42 + i * .88;
  add(new THREE.CylinderGeometry(1.05, 1.05, .74, 48), dbMat, 0, y, 0, db);
  add(new THREE.CylinderGeometry(1.0, 1.0, .02, 48), dbTop, 0, y + .38, 0, db);
  const rm = new THREE.MeshBasicMaterial({ color: 0x6ee7b7, toneMapped: false });
  ringMats.push(rm);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.065, .035, 8, 64), rm); ring.rotation.x = Math.PI / 2; ring.position.y = y - .12; db.add(ring);
}
const scanMat = new THREE.MeshBasicMaterial({ color: 0xff4d4d, transparent: true, opacity: 0, toneMapped: false });
const scanRing = new THREE.Mesh(new THREE.TorusGeometry(1.25, .06, 8, 64), scanMat); scanRing.rotation.x = Math.PI / 2; db.add(scanRing);

/* ================= Redis, gembok, perisai, globe ================= */
const redis = add(rbox(.8, .8, .8, .14), mat('#D83A2F', { roughness: .4 }), -.3, 1.25, -4.4);
redis.scale.setScalar(.001);
const redisRing = new THREE.Mesh(new THREE.TorusGeometry(.75, .03, 8, 48), new THREE.MeshBasicMaterial({ color: 0xc084fc, toneMapped: false }));
redisRing.position.copy(redis.position); scene.add(redisRing);

const lock = new THREE.Group(); lock.position.set(1.6, 2.15, -.35); scene.add(lock);
const gold = mat('#E9A93A', { roughness: .3, metalness: .5 });
add(rbox(.95, .78, .36, .12), gold, 0, 0, 0, lock);
add(new THREE.CylinderGeometry(.08, .08, .1, 16), mat('#5B3A0A'), 0, .02, .18, lock).rotation.x = Math.PI / 2;
const shackle = add(new THREE.TorusGeometry(.3, .075, 12, 32, Math.PI), mat('#C9CED8', { roughness: .25, metalness: .8 }), 0, .4, 0, lock);
lock.scale.setScalar(.001);

const shieldMat = new THREE.MeshBasicMaterial({ color: 0xff8a3d, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending });
const shield = new THREE.Mesh(new THREE.CircleGeometry(2.0, 6), shieldMat); shield.position.set(1.6, 1.95, -.15); scene.add(shield);
const shieldEdgeMat = new THREE.LineBasicMaterial({ color: 0xffa25c, transparent: true, opacity: 0 });
const shieldEdge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(Array.from({ length: 6 }, (_, i) => V(Math.cos(i / 6 * Math.PI * 2) * 2, Math.sin(i / 6 * Math.PI * 2) * 2, 0))), shieldEdgeMat);
shield.add(shieldEdge);

const globe = new THREE.Group(); globe.position.set(1.5, 3.4, -14); scene.add(globe);
add(new THREE.SphereGeometry(1.3, 40, 30), mat('#3B82F6', { roughness: .35 }), 0, 0, 0, globe);
const globeWire = new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(1.42, 2)), new THREE.LineBasicMaterial({ color: 0xbfdbfe }));
globe.add(globeWire);
globe.scale.setScalar(.001);

/* ================= kabel ================= */
const cMon = new THREE.CatmullRomCurve3([V(-1.2, 2.4, 3.5), V(-1.0, 1.3, 3.2), V(-.6, .05, 2.6), V(1.0, .05, .4), V(1.5, .05, -.9), V(1.6, .45, -1.25)]);
const cDb = new THREE.CatmullRomCurve3([V(1.6, .4, -2.75), V(1.3, .05, -3.6), V(.2, .05, -5.6), V(-.6, .05, -6.8), V(-.85, .5, -7.0)]);
const cCloud = new THREE.CatmullRomCurve3([V(1.5, 3.4, -14), V(.8, 9.0, -8), V(-.6, 7.2, -.5), V(-1.2, 4.0, 3.5)]);
const cRedis = new THREE.CatmullRomCurve3([V(1.0, 1.2, -2.6), V(.4, 1.3, -3.6), V(-.3, 1.25, -4.4)]);
const cableMat = mat('#2B2F3A', { roughness: .5 });
for (const c of [cMon, cDb]) { const m = new THREE.Mesh(new THREE.TubeGeometry(c, 80, .045, 8), cableMat); m.castShadow = true; scene.add(m); }
const arcMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0, toneMapped: false });
scene.add(new THREE.Mesh(new THREE.TubeGeometry(cCloud, 100, .03, 6), arcMat));

/* ================= paket data ================= */
const haloCv = document.createElement('canvas'); haloCv.width = haloCv.height = 64;
{ const g = haloCv.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }
const haloTex = new THREE.CanvasTexture(haloCv);
const POOL = Array.from({ length: 180 }, () => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(.085, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, toneMapped: false }));
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.setScalar(.7); m.add(s); m.visible = false; scene.add(m); return m;
});
const C_BLUE = '#3B82F6', C_GREEN = '#10B981', C_RED = '#FF4D3D', C_ORANGE = '#FF8A3D', C_PURPLE = '#B26BFF', C_SKY = '#38BDF8';

function packets(t) {
  const out = [];
  const on = (curve, s, d, c, sc = 1) => { const u = (t - s) / d; if (u < 0 || u > 1) return; out.push([curve.getPointAt(u), c, Math.min(1, u * 8, (1 - u) * 8), sc]); };
  // ACT 1
  [2.85, 4.75, 5.1, 5.45, 5.8, 6.15].forEach(s => on(cMon, s, 1.55, C_BLUE));
  [6.9, 7.25, 7.6, 7.95, 8.3, 8.65].forEach(s => on(cDb, s, 1.25, C_GREEN));
  for (let k = 0; k < 6; k++) { on(cMon, 8.9 + k * .28, 1.1, C_BLUE); on(cDb, 9.1 + k * .28, 1.0, C_GREEN); }
  // ACT 2 sporadis
  for (let k = 0; k < 15; k++) { on(cMon, 11.2 + k * .9 + hash(k) * .3, 1.7, C_ORANGE); on(cDb, 11.6 + k * .9, 1.5, C_RED); }
  for (let k = 0; k < 11; k++) on(cRedis, 21.9 + k * .22, .45, C_PURPLE, .8);
  // rate limit: banjir request
  for (let i = 0; i < 80; i++) {
    const s = 24.9 + i * .036, d = .85, u = (t - s) / d;
    if (u < 0 || u > 1.35) continue;
    const from = V(1.6 + (hash(i) - .5) * 8, .5 + hash(i + 99) * 3.6, 9 + hash(i + 7) * 5);
    const hit = V(1.6 + (hash(i + 3) - .5) * 2.8, 1.95 + (hash(i + 5) - .5) * 2.6, -.12);
    const blocked = hash(i + 11) < .82;
    if (u <= 1) out.push([from.lerp(hit, u), C_ORANGE, Math.min(1, u * 6), 1]);
    else if (blocked) out.push([hit, '#FFD9A8', 1 - (u - 1) / .35, 1 + (u - 1) * 6]);
    else { const k = (u - 1) / .35; out.push([hit.clone().lerp(V(1.6, hit.y, -1.3), k), C_RED, 1 - k, 1]); }
  }
  // lonjakan traffic
  for (let k = 0; k < 36; k++) on(cMon, 29.8 + k * .085, 1.0, C_RED);
  for (let i = 0; i < 70; i++) {
    const s = 30.0 + i * .04, u = (t - s) / .9; if (u < 0 || u > 1) continue;
    const tx = [1.6, 3.7, 5.8, 7.9][i % 4], tz = i % 3 ? -2.2 : -4.6;
    out.push([V(tx + (hash(i) - .5) * 3, 10 - u * 6.2, tz + (hash(i + 4) - .5) * 2), C_RED, Math.min(1, (1 - u) * 6), .9]);
  }
  // ACT 4 tenang
  for (let k = 0; k < 22; k++) { on(cMon, 33.6 + k * .45, 1.3, C_BLUE); on(cDb, 33.9 + k * .45, 1.1, C_GREEN); }
  for (let k = 0; k < 10; k++) on(cCloud, 37.6 + k * .4, 1.4, C_SKY, 1.3);
  return out;
}

const CODE = [

  const night = mood > .5;
  if (night !== lastNight) { vp.classList.toggle('night', night); lastNight = night; }
  // cahaya & warna
  tmpC.copy(BG_DAY).lerp(BG_NIGHT, mood); scene.background.copy(tmpC); scene.fog.color.copy(tmpC); vp.style.background = '#' + tmpC.getHexString();
  hemi.intensity = lerp(1.3, .22, mood); hemi.color.set(mood > .5 ? 0x46557a : 0xfff4e6);
  sun.intensity = lerp(2.6, .12, mood);
  floorMat.color.copy(FLOOR_DAY).lerp(FLOOR_NIGHT, mood);
  const siren = .5 + .5 * Math.sin(t * 9);
  alarm.intensity = mood * (18 + 26 * siren);
  screenGlow.intensity = mood * 6;
  beacon.material.color.set(mood > .5 ? (siren > .5 ? 0xff3b30 : 0xb01e1e) : 0x5a1a1a);
  beamMat.opacity = mood * .22; beamPivot.rotation.y = t * 5;
  // LED
  LEDS.forEach((m, i) => {
    const blink = (Math.sin(t * (7 + i * 1.7) + i * 2.1) > -.2) ? 1 : .25;
    const base = mood > .5 ? (i % 3 === 0 ? LED_BAD : (siren > .5 ? LED_BAD : LED_INFO)) : (i % 2 ? LED_OK : LED_INFO);
    m.color.copy(base).multiplyScalar(blink);
  });
  // DB ring: menyala saat menulis
  const write = clamp(1 - Math.abs(t - 8.6) / .8) + clamp(1 - Math.abs(t - 20.7) / .4);
  ringMats.forEach((m, i) => m.color.set(mood > .5 ? '#2a6b58' : '#6ee7b7').multiplyScalar(1 + write * 1.8 * (1 + .3 * Math.sin(t * 20 + i))));
  // scan ring indexing
  const sw = win(t, 19.3, 21.6, .3);
  scanMat.opacity = sw;
  if (t < 20.55) { scanMat.color.set('#FF4D3D'); scanRing.position.y = .1 + 2.4 * (.5 - .5 * Math.cos((t - 19.3) * 2.2)); scanRing.scale.setScalar(1); }
  else { scanMat.color.set('#34D399'); scanRing.position.y = 1.3; scanRing.scale.setScalar(1 + .25 * out3(clamp((t - 20.55) / .4))); }
  // gembok
  const lk = t < 15.3 ? 0 : t < 19.05 ? backOut(clamp((t - 15.3) / .55)) : 1 - clamp((t - 19.05) / .25);
  lock.scale.setScalar(Math.max(.001, lk)); lock.rotation.y = Math.sin(t * 1.4) * .25;
  shackle.position.y = .4 + .28 * (1 - out3(clamp((t - 16.6) / .25)));
  // redis
  const rk = t < 21.6 ? 0 : backOut(clamp((t - 21.6) / .5));
  redis.scale.setScalar(Math.max(.001, rk)); redis.rotation.y = t * .6; redis.position.y = 1.25 + Math.sin(t * 2) * .08;
  redisRing.scale.setScalar(Math.max(.001, rk)); redisRing.rotation.x = Math.PI / 2 + Math.sin(t) * .4; redisRing.rotation.y = t * 1.3; redisRing.position.y = redis.position.y;
  // perisai rate limit
  const shw = win(t, 24.8, 28.1, .3);
  const hitFlash = .5 + .5 * Math.sin(t * 31);
  shieldMat.opacity = shw * (.14 + .1 * hitFlash); shieldEdgeMat.opacity = shw;
  shield.scale.setScalar(.8 + .2 * out3(clamp((t - 24.8) / .4)));
  // autoscale
  extraRacks.forEach((r, i) => {
    const k = clamp((t - 30.2 - i * .28) / .55);
    r.visible = k > 0; r.scale.y = Math.max(.001, backOut(k));
  });
  // globe
  const gk = t < 37.4 ? 0 : backOut(clamp((t - 37.4) / .7));
  globe.scale.setScalar(Math.max(.001, gk)); globe.rotation.y = t * .5;
  arcMat.opacity = .85 * clamp((t - 37.6) / .6) * (1 - clamp((t - 41.6) / .4));
  // label
  LBL.forEach(([s, st]) => { const k = clamp((t - st) / .4) * (1 - clamp((t - 41.5) / .3)); s.material.opacity = k; s.visible = k > 0; const e = backOut(clamp((t - st) / .4)); s.scale.set(1.9 * Math.max(.01, e), .52 * Math.max(.01, e), 1); });
  // daun & mug bernapas
  leaves.forEach((l, i) => { l.scale.setScalar(1 + .06 * Math.sin(t * 1.6 + i)); });
  // tekstur layar
  drawScreen(t); drawRack(t, mood);
  const dw = Math.max(win(t, 7.7, 10.6, .35), win(t, 19.3, 21.6, .3));
  DBP.sprite.visible = dw > 0; DBP.sprite.material.opacity = dw;
  if (dw > 0) drawDbPanel(t);
  const cw = win(t, 21.8, 24.6, .3);
  CIP.sprite.visible = cw > 0; CIP.sprite.material.opacity = cw;
  if (cw > 0) drawCiPanel(t);
  // paket
  const list = packets(t);
  POOL.forEach((m, i) => {
    const p = list[i];
    if (!p) { m.visible = false; return; }
    m.visible = true; m.position.copy(p[0]);
    m.material.color.set(p[1]); m.material.opacity = clamp(p[2]);
    m.children[0].material.color.set(p[1]); m.children[0].material.opacity = clamp(p[2]) * .9;
    m.scale.setScalar(p[3]);
  });
  // kamera
  const [cp, cl] = camAt(t);
  camera.position.copy(cp);
  camera.position.x += Math.sin(t * .7) * .06; camera.position.y += Math.sin(t * .9 + 1) * .05;
  const shake = clamp(1 - Math.abs(t - 11.0) / .5) * .14 + clamp(1 - Math.abs(t - 30.6) / .9) * .07;
  camera.position.x += Math.sin(t * 63) * shake; camera.position.y += Math.sin(t * 71 + 1.3) * shake;
  camera.lookAt(cl);
  renderer.render(scene, camera);
}

/* ================= playback ================= */
const audio = document.getElementById('vo');
let lastT = -1;
function seek(t) { tl.time(t, false); render(t); lastT = t; }
function loop() {
  const t = tl.time();
  if (!audio.paused && Math.abs(audio.currentTime - t) > .12) tl.time(audio.currentTime);
  if (t !== lastT) { render(tl.time()); lastT = t; }
  if (DEBUG) { dbgT.textContent = t.toFixed(2); dbgR.value = t; }
  requestAnimationFrame(loop);
}
const dbgT = document.getElementById('dbg-t'), dbgR = document.getElementById('dbg-r');
if (DEBUG) { document.getElementById('debug').style.display = 'flex'; dbgR.addEventListener('input', () => { tl.pause(); audio.pause(); seek(+dbgR.value); }); }

function start(t = 0) { tl.play(t); if (!CLEAN) { audio.currentTime = t; audio.play().catch(() => {}); } }
tl.eventCallback('onComplete', () => start(0));
addEventListener('keydown', e => {
  if (e.code === 'KeyR') start(0);
  if (e.code === 'Space') { e.preventDefault(); if (tl.paused()) start(tl.time()); else { tl.pause(); audio.pause(); } }
});

await document.fonts.load(`800 40px 'Plus Jakarta Sans'`); await document.fonts.load(`600 40px 'Plus Jakarta Sans'`);
await document.fonts.load(`700 40px 'JetBrains Mono'`); await document.fonts.load(`800 40px 'JetBrains Mono'`);
await document.fonts.ready;
seek(0);
window.OPENER = { W, H, DURATION, tl, ready: true, seek };
requestAnimationFrame(loop);

if (!CLEAN && !DEBUG) {
  audio.play().then(() => start(0)).catch(() => {
    const go = () => { removeEventListener('pointerdown', go); removeEventListener('keydown', go); start(0); };
    addEventListener('pointerdown', go); addEventListener('keydown', go);
  });
}
</script>
